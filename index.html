<!doctype html>
<html lang="ja">
<head>

<style>
:root{--text:#202124;--muted:#777;--line:#e9e9e9;--bg:#f7f7f7;--card:#fff;--accent:#111}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--text);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:900px;margin:auto;min-height:100vh;background:#fff}.top{position:sticky;top:0;z-index:1000;background:#fff;border-bottom:1px solid var(--line);padding:12px 14px calc(10px + env(safe-area-inset-top))}.title-row{display:flex;align-items:center;justify-content:space-between}.title{font-size:21px;font-weight:800}.sub{font-size:11px;color:var(--muted);margin-top:2px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.tab{border:0;background:#f1f1f1;border-radius:10px;padding:9px 4px;font-size:12px}.tab.active{background:#111;color:#fff}.content{padding:12px 14px 100px}.panel{display:none}.panel.active{display:block}.map-wrap{height:56vh;min-height:390px;border-radius:16px;overflow:hidden;border:1px solid var(--line);position:relative}.map{height:100%;width:100%}.map-actions{position:absolute;z-index:500;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap}.map-actions button{background:#fff;border:1px solid #ddd;border-radius:10px;padding:8px 10px;box-shadow:0 2px 8px #0001;font-size:11px}.filters{display:grid;grid-template-columns:1.4fr .9fr .9fr;gap:7px;margin-bottom:10px}.input,.select,.textarea{width:100%;border:1px solid #ddd;border-radius:10px;background:#fff;padding:10px 11px;outline:none}.textarea{min-height:80px;resize:vertical}.cards{display:grid;gap:10px}.card{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}.place-head,.item{display:flex;gap:10px;align-items:flex-start}.place-main,.item-main{flex:1;min-width:0}.place-name,.item-name{font-size:15px;font-weight:750}.meta,.item-meta{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.45}.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.chip{background:#f3f3f3;border-radius:999px;padding:5px 8px;font-size:10px}.status{font-size:10px;padding:5px 8px;border-radius:999px;background:#111;color:#fff}.status.done{background:#e8f5ed;color:#25633c}.priority{letter-spacing:1px}.toolbar{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.btn{border:1px solid #ddd;background:#fff;border-radius:9px;padding:8px 10px;font-size:11px}.btn.primary{background:#111;color:#fff;border-color:#111}.btn.danger{color:#a33}.btn.small{padding:6px 8px}.thumb{width:68px;height:68px;object-fit:cover;border-radius:11px;background:#eee;flex:none}.empty{text-align:center;color:var(--muted);font-size:13px;padding:38px 12px}.section-title{font-size:16px;font-weight:800;margin:16px 0 9px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f7f7f7;border-radius:12px;padding:11px}.stat b{display:block;font-size:18px}.stat span{font-size:10px;color:var(--muted)}.trip-card{display:flex;justify-content:space-between;gap:10px;align-items:center}.trip-info{flex:1}.trip-name{font-weight:750}.price{font-weight:700;font-size:12px}.modal{position:fixed;inset:0;background:#0006;z-index:3000;display:none;align-items:flex-end}.modal.show{display:flex}.sheet{width:100%;max-width:720px;margin:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));max-height:94vh;overflow:auto}.sheet h2{font-size:18px;margin:0 0 14px}.form{display:grid;gap:11px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.label{font-size:11px;color:var(--muted);margin:0 0 5px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.photo-preview{width:78px;height:78px;border-radius:12px;object-fit:cover}.photos{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.photo-box{position:relative}.photo-box button{position:absolute;right:-4px;top:-4px;border:0;border-radius:50%;width:22px;height:22px;background:#111;color:#fff}.hint,.geo-status{font-size:10px;color:var(--muted);line-height:1.5}.geo-status.ok{color:#286b43}.geo-status.err{color:#a33}.footer-note{font-size:10px;color:#999;margin-top:14px}.leaflet-div-icon{background:transparent;border:0}.pin{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;background:#111;color:#fff;border:3px solid #fff;box-shadow:0 2px 7px #0003}.pin span{transform:rotate(45deg);font-size:15px}.range{display:flex;align-items:center;gap:8px}.range input{flex:1}
@media(max-width:560px){.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.summary{grid-template-columns:1fr 1fr 1fr}.row{grid-template-columns:1fr 1fr}}
.search-row{display:flex;gap:8px;align-items:stretch}.search-row .input{flex:1}.geo-help{font-size:12px;color:#777;margin-top:6px}.geo-results{display:grid;gap:6px;margin-top:8px}.geo-result{display:flex;flex-direction:column;text-align:left;padding:10px 12px;border:1px solid #ddd;border-radius:12px;background:#fff}.geo-result span{font-size:12px;color:#666;margin-top:3px}.geo-status{margin-top:7px;font-size:13px}.geo-status.ok{color:#16734a}.geo-status.err{color:#b42318}
</style>

<body><div class="app">
<header class="top"><div class="title-row"><div><div class="title">Want Map</div><div class="sub">行きたい場所を、地図に残そう。</div></div><button class="btn primary" onclick="openPlace()">＋ 追加</button></div><div class="tabs"><button class="tab active" data-tab="map">🗺️ 地図</button><button class="tab" data-tab="places">📍 場所</button><button class="tab" data-tab="items">📝 リスト</button><button class="tab" data-tab="trips">✈️ 旅行</button></div></header>
<main class="content">
<section id="panel-map" class="panel active"><div class="map-wrap"><div id="map" class="map"></div><div class="map-actions"><button onclick="fitAll()">全体表示</button><button onclick="filterVisible()">このエリアだけ</button><button onclick="clearMapFilter()">全て表示</button></div></div><div class="section-title">地図の絞り込み</div><div class="filters"><input id="mapQ" class="input" placeholder="場所・住所を検索"><select id="mapCat" class="select"><option value="">カテゴリすべて</option></select><select id="mapStatus" class="select"><option value="">ステータスすべて</option><option value="want">行きたい</option><option value="done">行った</option></select></div><div id="mapCards" class="cards"></div></section>
<section id="panel-places" class="panel"><div class="filters"><input id="placeQ" class="input" placeholder="場所・住所・ジャンルを検索"><select id="placeCat" class="select"><option value="">カテゴリすべて</option></select><select id="placeStatus" class="select"><option value="">ステータスすべて</option><option value="want">行きたい</option><option value="done">行った</option></select></div><div id="places" class="cards"></div></section>
<section id="panel-items" class="panel"><div class="summary" id="stats"></div><div class="section-title">買いたい・食べたい</div><div class="filters"><input id="itemQ" class="input" placeholder="検索"><select id="itemType" class="select"><option value="">種類すべて</option><option value="buy">🛍 買いたい</option><option value="eat">🍴 食べたい</option></select><select id="itemStatus" class="select"><option value="">ステータスすべて</option><option value="want">行きたい</option><option value="done">済み</option></select></div><div id="items" class="cards"></div></section>
<section id="panel-trips" class="panel"><div class="section-title">旅行・お出かけ</div><button class="btn primary" onclick="openTrip()">＋ 旅行を追加</button><div id="trips" class="cards" style="margin-top:10px"></div><div class="footer-note">旅行に場所を追加すると、その旅行に行きたいスポットをまとめて見られます。</div></section>
</main></div>
<div id="modal" class="modal"><div class="sheet"><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const KEY='want-map-pwa-v2';const TRIP_KEY='want-map-trips-v1';
let data=JSON.parse(localStorage.getItem(KEY)||'{"places":[],"items":[]}');let trips=JSON.parse(localStorage.getItem(TRIP_KEY)||'[]');let map,markers=[],editing=null,mapAreaFilter=false;
const CATS={food:{label:'🍴 飲食店',genres:['カフェ・喫茶店','スイーツ','パン・ベーカリー','和食','洋食','中華','韓国料理','イタリアン','フレンチ','ラーメン','居酒屋','その他']},shopping:{label:'🛍️ 買い物',genres:['服・ファッション','コスメ・美容','雑貨','家具・インテリア','家電','本・文具','食品・食材','お土産','その他']},sightseeing:{label:'📷 観光・スポット',genres:['観光名所','美術館・博物館','神社・寺','公園・自然','撮影スポット','エンタメ','その他']},hotel:{label:'🏨 ホテル・宿',genres:['ホテル','旅館','民宿・ゲストハウス','その他']},other:{label:'📍 その他',genres:['その他']}};
function $(id){return document.getElementById(id)}function esc(s=''){return String(s).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}function yen(n){return n?`¥${Number(n).toLocaleString('ja-JP')}`:'—'}function persist(){localStorage.setItem(KEY,JSON.stringify(data));render()}function persistTrips(){localStorage.setItem(TRIP_KEY,JSON.stringify(trips));renderTrips()}
function catOptions(sel=''){return '<option value="">カテゴリを選択</option>'+Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${k===sel?'selected':''}>${v.label}</option>`).join('')}
function genreOptions(cat,sel=''){let gs=CATS[cat]?.genres||[];return '<option value="">選択してください</option>'+gs.map(g=>`<option ${g===sel?'selected':''}>${esc(g)}</option>`).join('')}
function fillFilter(id){$(id).innerHTML='<option value="">カテゴリすべて</option>'+Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('')}
function initMap(){map=L.map('map').setView([35.6812,139.7671],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);renderMap()}
function markerIcon(p){let emoji=p.category==='food'?'🍴':p.category==='shopping'?'🛍️':p.category==='sightseeing'?'📷':p.category==='hotel'?'🏨':'📍';return L.divIcon({className:'',html:`<div class="pin"><span>${emoji}</span></div>`,iconSize:[34,34],iconAnchor:[17,34],popupAnchor:[0,-30]})}
function filteredPlaces(extraArea=false){let q=($('mapQ')?.value||'').toLowerCase(),cat=$('mapCat')?.value||'',status=$('mapStatus')?.value||'';return data.places.filter(p=>{let hay=[p.name,p.address,p.city,p.area,p.genre].join(' ').toLowerCase();let ok=(!q||hay.includes(q))&&(!cat||p.category===cat)&&(!status||p.status===status);if(extraArea&&map&&p.lat&&p.lng)ok=ok&&map.getBounds().contains([p.lat,p.lng]);return ok})}
function renderMap(){if(!map)return;markers.forEach(m=>m.remove());markers=[];let arr=filteredPlaces(mapAreaFilter);arr.forEach(p=>{if(p.lat&&p.lng){let m=L.marker([p.lat,p.lng],{icon:markerIcon(p)}).addTo(map).bindPopup(`<b>${esc(p.name)}</b><br>${esc(CATS[p.category]?.label||'')} ${p.genre?'・'+esc(p.genre):''}<br>${esc(p.address||'')}${p.price?'<br>'+yen(p.price):''}<br><button class="btn small" onclick="openPlace('${p.id}')">編集</button>`);markers.push(m)}});renderMapCards(arr)}
function renderMapCards(arr=filteredPlaces(mapAreaFilter)){$('mapCards').innerHTML=arr.length?arr.map(placeCard).join(''):'<div class="empty">この条件の場所はありません。</div>'}
function placeCard(p){let its=data.items.filter(i=>i.placeId===p.id);let stars='★'.repeat(Number(p.priority||0))+'☆'.repeat(3-Number(p.priority||0));return `<div class="card"><div class="place-head"><div class="place-main"><div class="place-name">${esc(p.name)}</div><div class="meta">${esc(p.address||'住所未登録')}</div>${p.city||p.area?`<div class="meta">${esc([p.city,p.area].filter(Boolean).join(' / '))}</div>`:''}</div><span class="status ${p.status==='done'?'done':''}">${p.status==='done'?'行った':'行きたい'}</span></div><div class="chips"><span class="chip">${esc(CATS[p.category]?.label||'📍 その他')}</span>${p.genre?`<span class="chip">${esc(p.genre)}</span>`:''}<span class="chip priority">${stars}</span>${p.price?`<span class="chip">予算 ${yen(p.price)}</span>`:''}</div>${p.note?`<div class="meta">${esc(p.note)}</div>`:''}<div class="chips">${its.length?its.map(i=>`<span class="chip">${i.type==='buy'?'🛍':'🍴'} ${esc(i.name)}${i.price?' ・ '+yen(i.price):''}</span>`).join(''):'<span class="meta">やりたいこと未登録</span>'}</div><div class="toolbar"><button class="btn" onclick="openItem(null,'${p.id}')">＋ 買う・食べる</button><button class="btn" onclick="openPlace('${p.id}')">編集</button><button class="btn danger" onclick="delPlace('${p.id}')">削除</button></div></div>`}
function openPlace(id=null){editing={kind:'place',id};let p=id?data.places.find(x=>x.id===id):{status:'want',priority:1};$('modalTitle').textContent=id?'場所を編集':'行きたい場所を追加';$('modalBody').innerHTML=`<form id="placeForm" class="form"><div><div class="label">店名・スポット名 *</div><input class="input" name="name" value="${esc(p.name||'')}" placeholder="例：○○カフェ" required></div><div><div class="label">住所 *</div><div class="search-row"><input class="input" id="address" name="address" value="${esc(p.address||'')}" placeholder="例：東京都渋谷区○○1-2-3" required><button type="button" class="btn primary" id="geoBtn">🔍 検索</button></div><div class="geo-help">住所を入力して「検索」すると候補が表示されます。候補を選ぶと地図上のピン位置が決まります。</div><div id="geo" class="geo-status"></div><div id="geoResults" class="geo-results"></div></div><div class="row"><div><div class="label">カテゴリ *</div><select class="select" id="category" name="category" required>${catOptions(p.category||'')}</select></div><div><div class="label">ジャンル</div><select class="select" id="genre" name="genre">${genreOptions(p.category||'',p.genre||'')}</select></div></div><div class="row"><div><div class="label">ステータス</div><select class="select" name="status"><option value="want" ${p.status!=='done'?'selected':''}>行きたい</option><option value="done" ${p.status==='done'?'selected':''}>行った</option></select></div><div><div class="label">優先度</div><select class="select" name="priority"><option value="0" ${p.priority==0?'selected':''}>☆ なし</option><option value="1" ${p.priority==1?'selected':''}>★</option><option value="2" ${p.priority==2?'selected':''}>★★</option><option value="3" ${p.priority==3?'selected':''}>★★★</option></select></div></div><div><div class="label">価格・予算（円）</div><input class="input" type="number" min="0" name="price" value="${p.price||''}" placeholder="例：5000"></div><div><div class="label">旅行に追加</div><select class="select" name="tripId"><option value="">旅行を選択しない</option>${trips.map(t=>`<option value="${t.id}" ${p.tripId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div><div class="label">メモ</div><textarea class="textarea" name="note" placeholder="予約・注意点・一緒に行く人など">${esc(p.note||'')}</textarea></div><div><div class="label">写真（複数可）</div><input class="input" type="file" id="placePhotos" accept="image/*" multiple><div id="placePhotosPreview" class="photos">${(p.photos||[]).map((s,i)=>`<div class="photo-box"><img class="photo-preview" src="${s}"><button type="button" onclick="removeTempPhoto(${i})">×</button></div>`).join('')}</div></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">キャンセル</button><button class="btn primary">保存</button></div></form>`;$('modal').classList.add('show');bindPlaceForm(p);if(p.lat&&p.lng){$('geo').textContent='✓ 登録済みの地図位置があります';$('geo').className='geo-status ok';$('address').dataset.selectedGeo=JSON.stringify({lat:p.lat,lng:p.lng,city:p.city||'',area:p.area||''})}}
function bindPlaceForm(old){let cat=$('category'),genre=$('genre');cat.onchange=()=>genre.innerHTML=genreOptions(cat.value);$('geoBtn').onclick=()=>searchAddress();$('address').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchAddress()}});$('placePhotos').addEventListener('change',e=>readFiles(e.target.files,'placePhotosPreview',old.photos||[]));$('placeForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),addr=f.get('address').trim(),selected=$('address').dataset.selectedGeo?JSON.parse($('address').dataset.selectedGeo):null;let geo=selected;if(!geo){geo=await searchAddress(true);if(!geo){$('geo').textContent='住所を検索して、候補から場所を選んでください。';$('geo').className='geo-status err';return}}let photos=await collectPhotos(old.photos||[],'placePhotosPreview');let x={name:f.get('name').trim(),address:addr,category:f.get('category'),genre:f.get('genre'),status:f.get('status'),priority:Number(f.get('priority')||0),price:Number(f.get('price')||0),tripId:f.get('tripId')||'',note:f.get('note')||'',photos,lat:geo?.lat??old.lat??null,lng:geo?.lng??old.lng??null,city:geo?.city??old.city??'',area:geo?.area??old.area??''};if(editing.id)Object.assign(data.places.find(p=>p.id===editing.id),x);else data.places.push({id:uid(),...x});closeModal();persist()}}
async function searchAddress(autoPick=false){let addr=$('address')?.value.trim(),name=document.querySelector('#placeForm [name="name"]')?.value.trim();if(!addr)return null;$('geo').textContent='場所を検索中…';$('geo').className='geo-status';$('geoResults').innerHTML='';try{let q=[name,addr].filter(Boolean).join(', ');let url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&addressdetails=1&accept-language=ja&q='+encodeURIComponent(q);let r=await fetch(url,{headers:{'Accept':'application/json'}});if(!r.ok)throw new Error('HTTP '+r.status);let a=await r.json();if(!a.length&&name){url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&addressdetails=1&accept-language=ja&q='+encodeURIComponent(addr);r=await fetch(url,{headers:{'Accept':'application/json'}});a=await r.json()}if(!a.length){$('geo').textContent='候補が見つかりませんでした。住所を少し簡略化して再検索してください。';$('geo').className='geo-status err';return null}if(autoPick){let x=a[0],ad=x.address||{};let geo={lat:Number(x.lat),lng:Number(x.lon),city:ad.city||ad.town||ad.village||ad.municipality||'',area:ad.suburb||ad.neighbourhood||ad.quarter||ad.city_district||''};$('address').dataset.selectedGeo=JSON.stringify(geo);$('geo').textContent='✓ 地図上の位置を取得しました';$('geo').className='geo-status ok';return geo}$('geo').textContent=`候補が${a.length}件見つかりました。正しい場所を選択してください。`;$('geo').className='geo-status ok';$('geoResults').innerHTML=a.map((x,i)=>`<button type="button" class="geo-result" onclick="selectGeo(${i})"><b>${esc(x.name||'候補')}</b><span>${esc(x.display_name||'')}</span></button>`).join('');window._geoCandidates=a;return null}catch(e){$('geo').textContent='位置検索に失敗しました。通信状態を確認してください。';$('geo').className='geo-status err';return null}}
function selectGeo(i){let x=window._geoCandidates?.[i];if(!x)return;let ad=x.address||{};let geo={lat:Number(x.lat),lng:Number(x.lon),city:ad.city||ad.town||ad.village||ad.municipality||'',area:ad.suburb||ad.neighbourhood||ad.quarter||ad.city_district||''};$('address').dataset.selectedGeo=JSON.stringify(geo);$('geoResults').innerHTML='';$('geo').textContent='✓ この場所を選択しました。保存すると地図にピンが付きます';$('geo').className='geo-status ok'}
function readFiles(files,previewId,existing){let box=$(previewId);[...files].forEach(file=>{let r=new FileReader();r.onload=()=>{let d=document.createElement('div');d.className='photo-box';d.dataset.temp=r.result;d.innerHTML=`<img class="photo-preview" src="${r.result}"><button type="button">×</button>`;d.querySelector('button').onclick=()=>d.remove();box.appendChild(d)};r.readAsDataURL(file)})}
async function collectPhotos(existing,previewId){let arr=[];document.querySelectorAll('#'+previewId+' .photo-box').forEach(b=>arr.push(b.dataset.temp||b.querySelector('img')?.src));return arr.filter(Boolean)}
function removeTempPhoto(i){let boxes=document.querySelectorAll('#placePhotosPreview .photo-box');if(boxes[i])boxes[i].remove()}
function openItem(id=null,placeId=''){editing={kind:'item',id};let i=id?data.items.find(x=>x.id===id):{type:'buy',placeId,status:'want'};$('modalTitle').textContent=id?'リストを編集':'買いたい・食べたいを追加';$('modalBody').innerHTML=`<form id="itemForm" class="form"><div><div class="label">内容 *</div><input class="input" name="name" value="${esc(i.name||'')}" placeholder="例：クロッフル、コスメ" required></div><div class="row"><div><div class="label">種類</div><select class="select" name="type"><option value="buy" ${i.type==='buy'?'selected':''}>🛍 買いたい</option><option value="eat" ${i.type==='eat'?'selected':''}>🍴 食べたい</option></select></div><div><div class="label">場所 *</div><select class="select" name="placeId" required>${data.places.map(p=>`<option value="${p.id}" ${i.placeId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div></div><div class="row"><div><div class="label">価格・予算（円）</div><input class="input" type="number" min="0" name="price" value="${i.price||''}" placeholder="例：3000"></div><div><div class="label">ステータス</div><select class="select" name="status"><option value="want" ${i.status!=='done'?'selected':''}>行きたい</option><option value="done" ${i.status==='done'?'selected':''}>済み</option></select></div></div><div><div class="label">メモ</div><textarea class="textarea" name="note">${esc(i.note||'')}</textarea></div><div><div class="label">写真</div><input class="input" type="file" name="photo" accept="image/*"><div class="photos">${i.photo?`<img class="photo-preview" src="${i.photo}">`:''}</div></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">キャンセル</button><button class="btn primary">保存</button></div></form>`;$('modal').classList.add('show');$('itemForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),old=id?data.items.find(x=>x.id===id):{},photo=old.photo||null,file=f.get('photo');if(file&&file.size)photo=await fileToData(file);let x={name:f.get('name').trim(),type:f.get('type'),placeId:f.get('placeId'),price:Number(f.get('price')||0),status:f.get('status'),note:f.get('note')||'',photo};if(id)Object.assign(old,x);else data.items.push({id:uid(),...x});closeModal();persist()}}
function fileToData(file){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
function delPlace(id){if(confirm('この場所と紐づくリストも削除しますか？')){data.places=data.places.filter(p=>p.id!==id);data.items=data.items.filter(i=>i.placeId!==id);persist()}}function delItem(id){if(confirm('削除しますか？')){data.items=data.items.filter(i=>i.id!==id);persist()}}
function renderPlaces(){let q=($('placeQ')?.value||'').toLowerCase(),cat=$('placeCat')?.value||'',st=$('placeStatus')?.value||'';let arr=data.places.filter(p=>(!q||[p.name,p.address,p.city,p.area,p.genre,p.note].join(' ').toLowerCase().includes(q))&&(!cat||p.category===cat)&&(!st||p.status===st));$('places').innerHTML=arr.length?arr.map(placeCard).join(''):'<div class="empty">条件に合う場所がありません。</div>'}
function renderItems(){let q=($('itemQ')?.value||'').toLowerCase(),t=$('itemType')?.value||'',st=$('itemStatus')?.value||'';let arr=data.items.filter(i=>{let p=data.places.find(p=>p.id===i.placeId);return(!q||[i.name,i.note,p?.name,p?.address].join(' ').toLowerCase().includes(q))&&(!t||i.type===t)&&(!st||i.status===st)});$('items').innerHTML=arr.length?arr.map(i=>{let p=data.places.find(p=>p.id===i.placeId);return `<div class="card"><div class="item">${i.photo?`<img class="thumb" src="${i.photo}">`:''}<div class="item-main"><div class="item-name">${i.type==='buy'?'🛍':'🍴'} ${esc(i.name)}</div><div class="item-meta">${esc(p?.name||'場所未設定')} ${i.price?'・ '+yen(i.price):''}</div><div class="chips"><span class="status ${i.status==='done'?'done':''}">${i.status==='done'?'済み':'行きたい'}</span>${i.note?`<span class="chip">${esc(i.note)}</span>`:''}</div></div><button class="btn" onclick="openItem('${i.id}')">編集</button><button class="btn danger" onclick="delItem('${i.id}')">削除</button></div></div>`}).join(''):'<div class="empty">条件に合うものがありません。</div>';let want=data.items.filter(i=>i.status!=='done').length,done=data.items.filter(i=>i.status==='done').length,total=data.items.reduce((s,i)=>s+Number(i.price||0),0);$('stats').innerHTML=`<div class="stat"><b>${want}</b><span>未完了</span></div><div class="stat"><b>${done}</b><span>済み</span></div><div class="stat"><b>${yen(total)}</b><span>登録価格合計</span></div>`}
function renderTrips(){let totalBudget=trips.reduce((s,t)=>s+Number(t.budget||0),0);$('trips').innerHTML=trips.length?trips.map(t=>{let ps=data.places.filter(p=>p.tripId===t.id),spent=ps.reduce((s,p)=>s+Number(p.price||0),0)+data.items.filter(i=>ps.some(p=>p.id===i.placeId)).reduce((s,i)=>s+Number(i.price||0),0);return `<div class="card trip-card"><div class="trip-info"><div class="trip-name">✈️ ${esc(t.name)}</div><div class="meta">${t.date?esc(t.date):''} ・ ${ps.length}か所 ${t.budget?'・予算 '+yen(t.budget):''}</div><div class="meta">登録価格 ${yen(spent)}</div></div><button class="btn" onclick="openTrip('${t.id}')">編集</button><button class="btn danger" onclick="delTrip('${t.id}')">削除</button></div>`}).join(''):'<div class="empty">まだ旅行がありません。</div>'}
function openTrip(id=null){let t=id?trips.find(x=>x.id===id):{};$('modalTitle').textContent=id?'旅行を編集':'旅行を追加';$('modalBody').innerHTML=`<form id="tripForm" class="form"><div><div class="label">旅行名 *</div><input class="input" name="name" value="${esc(t.name||'')}" placeholder="例：韓国旅行 2026.09" required></div><div class="row"><div><div class="label">日付</div><input class="input" type="date" name="date" value="${t.date||''}"></div><div><div class="label">旅行予算（円）</div><input class="input" type="number" min="0" name="budget" value="${t.budget||''}" placeholder="例：100000"></div></div><div><div class="label">メモ</div><textarea class="textarea" name="note">${esc(t.note||'')}</textarea></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">キャンセル</button><button class="btn primary">保存</button></div></form>`;$('modal').classList.add('show');$('tripForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),x={name:f.get('name').trim(),date:f.get('date'),budget:Number(f.get('budget')||0),note:f.get('note')||''};if(id)Object.assign(trips.find(t=>t.id===id),x);else trips.push({id:uid(),...x});closeModal();persistTrips()}}
function delTrip(id){if(confirm('旅行を削除しますか？登録した場所は削除されず、旅行との紐付けだけ外れます。')){trips=trips.filter(t=>t.id!==id);data.places.forEach(p=>{if(p.tripId===id)p.tripId=''});persist();persistTrips()}}
function filterVisible(){mapAreaFilter=true;renderMap();let arr=filteredPlaces(true);if(arr.length){let b=L.latLngBounds(arr.filter(p=>p.lat&&p.lng).map(p=>[p.lat,p.lng]));if(b.isValid())map.fitBounds(b.pad(.2))}}function clearMapFilter(){mapAreaFilter=false;renderMap()}function fitAll(){mapAreaFilter=false;let ps=data.places.filter(p=>p.lat&&p.lng);if(ps.length){let b=L.latLngBounds(ps.map(p=>[p.lat,p.lng]));map.fitBounds(b.pad(.2))}}
function closeModal(){$('modal').classList.remove('show');editing=null}$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('panel-'+b.dataset.tab).classList.add('active');if(b.dataset.tab==='map')setTimeout(()=>map.invalidateSize(),100)});
['placeQ','placeCat','placeStatus'].forEach(id=>$(id).addEventListener('input',renderPlaces));['itemQ','itemType','itemStatus'].forEach(id=>$(id).addEventListener('input',renderItems));['mapQ','mapCat','mapStatus'].forEach(id=>$(id).addEventListener('input',renderMap));
function render(){renderMap();renderPlaces();renderItems();renderTrips()}fillFilter('mapCat');fillFilter('placeCat');initMap();render();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
