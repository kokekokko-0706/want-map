<body><div class="app">
<header class="top"><div class="title-row"><div><div class="title">Want Map</div><div class="sub">行きたい場所を、地図に残そう。</div></div><div style="display:flex;align-items:center"><button class="manual-link backup-link" onclick="openBackup()">バックアップ</button><button class="manual-link" onclick="openManual()">使い方</button><button class="btn primary" onclick="openPlace()">＋ 追加</button></div></div><div class="tabs"><button class="tab active" data-tab="map"><span class="ico ico-map"></span>地図</button><button class="tab" data-tab="places"><span class="ico ico-pin"></span>場所</button><button class="tab" data-tab="items"><span class="ico ico-list"></span>リスト</button><button class="tab" data-tab="trips"><span class="ico ico-plane"></span>旅行</button></div></header>
<main class="content">
<section id="panel-map" class="panel active"><div class="map-wrap"><div id="map" class="map"></div><div class="map-actions"><button onclick="fitAll()">全地点を見る</button><button onclick="filterVisible()">このエリアだけ</button><button onclick="showNearby()">現在地周辺</button><button onclick="clearMapFilter()">絞り込み解除</button></div></div><div class="section-title">地図の絞り込み</div><div id="mapTagBar"></div><div class="filters"><input id="mapQ" class="input" placeholder="場所・住所・ジャンル・メモ・欲しいものを検索"><select id="mapCat" class="select"><option value="">カテゴリすべて</option></select><select id="mapStatus" class="select"><option value="">ステータスすべて</option><option value="want">行きたい</option><option value="done">行った</option><option value="again">また行きたい</option></select></div><div id="mapCards" class="cards"></div></section>
<section id="panel-places" class="panel"><div id="placeTagBar"></div><div class="filters"><input id="placeQ" class="input" placeholder="場所・住所・ジャンル・メモ・欲しいもの・駅名・路線を検索"><select id="placeCat" class="select"><option value="">カテゴリすべて</option></select><select id="placeStatus" class="select"><option value="">ステータスすべて</option><option value="want">行きたい</option><option value="done">行った</option><option value="again">また行きたい</option></select><select id="placeDeadline" class="select"><option value="">期限すべて</option><option value="set">期限あり</option><option value="soon">期限が近い</option><option value="overdue">期限切れ</option></select></div><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 10px"><span class="label" style="margin:0">並び順</span><select id="placeSort" class="select" style="max-width:220px"><option value="registered">登録順（新しい順）</option><option value="name">名前順</option><option value="address">住所順</option><option value="genre">ジャンル順</option><option value="line">路線順</option><option value="station">最寄り駅順</option><option value="priority">優先度順</option><option value="price">予算順</option><option value="visited">訪問日順</option><option value="deadline">期限順</option><option value="distance">現在地から近い順</option></select></div><div class="quickbar"><button class="btn" onclick="showNearby()">現在地から近い場所を表示</button><button class="btn" onclick="showStationSearch()">駅・路線から探す</button><button class="btn primary" onclick="openTodayPanel()">今日行く場所</button></div><div id="nearStatus" class="near-status"></div><div id="stationQuick" style="display:none;margin-bottom:10px"><div class="search-row"><input id="stationQ" class="input" placeholder="駅名・路線名で検索"><button class="btn" onclick="applyStationSearch()">検索</button></div></div><div id="todayPanel" style="display:none" class="route-box"></div><div id="places" class="cards"></div></section>
<section id="panel-items" class="panel"><div class="summary" id="stats"></div><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><div class="section-title" style="margin:16px 0 9px">したい・ほしい</div><button class="btn primary" onclick="openItem()">＋ リストを追加</button></div><div id="itemTagBar"></div><div class="filters"><input id="itemQ" class="input" placeholder="検索"><select id="itemType" class="select"><option value="">種類すべて</option><option value="buy">買いたい</option><option value="eat">食べたい</option><option value="do">やりたい</option></select><select id="itemStatus" class="select"><option value="">ステータスすべて</option><option value="want">未完了</option><option value="done">済み</option></select><select id="itemFavorite" class="select"><option value="">お気に入りすべて</option><option value="yes">お気に入りのみ</option></select><select id="itemDeadline" class="select"><option value="">期限すべて</option><option value="set">期限あり</option><option value="soon">期限が近い</option><option value="overdue">期限切れ</option></select><select id="itemSort" class="select"><option value="registered">登録順</option><option value="name">名前順</option><option value="type">種類順</option><option value="place">場所順</option><option value="priceAsc">価格の安い順</option><option value="priceDesc">価格の高い順</option><option value="status">未完了→済み</option><option value="deadline">期限順</option></select></div><div id="items" class="cards"></div></section>
<section id="panel-trips" class="panel"><div class="section-title">旅行・お出かけ</div><button class="btn primary" onclick="openTrip()">＋ 旅行・お出かけを追加</button><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0"><span class="label" style="margin:0">並び順</span><select id="tripSort" class="select" style="max-width:240px"><option value="nearest">開始日が近い順</option><option value="startAsc">開始日順（古い順）</option><option value="startDesc">開始日順（新しい順）</option><option value="registered">登録順（新しい順）</option></select></div><div id="trips" class="cards"></div><div class="footer-note">旅行に場所を追加すると、その旅行に行きたいスポットをまとめて見られます。</div></section>
</main></div>
<input id="backupFile" type="file" accept="application/json,.json" style="display:none" onchange="importBackupFile(this.files[0])"><div id="locationPicker" class="location-picker"><div class="location-picker-head"><button type="button" class="btn" onclick="closeLocationPicker()">キャンセル</button><div class="location-picker-title">地図から位置を指定</div></div><div id="locationPickerMap" class="location-picker-map"></div><div class="location-picker-foot"><div class="location-picker-hint">地図をタップしてピンを置けます。ピンはドラッグして細かく調整できます。</div><div id="locationPickerStatus" class="location-picker-note">位置を指定してください。</div><div class="location-picker-actions"><button type="button" class="btn" onclick="useCurrentLocationForPicker()">現在地を使う</button><button type="button" class="btn" onclick="reverseGeocodePickedLocation()">📍 この位置から住所を取得</button><button type="button" class="btn primary" onclick="applyPickedLocation()">この位置で決定</button></div></div></div><div id="modal" class="modal"><div class="sheet"><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const KEY='want-map-pwa-v2';const TRIP_KEY='want-map-trips-v1';const DATA_SCHEMA_VERSION=2;const BACKUP_VERSION=2;
function safeParse(raw,fallback){try{return JSON.parse(raw)}catch(e){return fallback}}
function normalizeData(raw){let x=raw&&typeof raw==='object'?raw:{};return{schemaVersion:DATA_SCHEMA_VERSION,places:Array.isArray(x.places)?x.places.map(p=>{let q=(p&&typeof p==='object')?{...p}:{};q.tripIds=Array.isArray(q.tripIds)?[...new Set(q.tripIds.filter(Boolean).map(String))]:[];if(q.tripId&&!q.tripIds.includes(String(q.tripId)))q.tripIds.push(String(q.tripId));if(q.tripIds.length)q.tripId=q.tripIds[0];else delete q.tripId;if(q.anywhere){q.lat=null;q.lng=null;q.stationName='';q.stationLat=null;q.stationLng=null;q.stationAddress='';q.stationDistance=0;q.lines=[]}q.tags=Array.isArray(q.tags)?[...new Set(q.tags.map(String).map(v=>v.trim()).filter(Boolean))]:[];q.photos=Array.isArray(q.photos)?q.photos.filter(Boolean):[];q.urls=Array.isArray(q.urls)?q.urls:[];return q}):[],items:Array.isArray(x.items)?x.items:[]}}
function normalizeTrips(raw){return Array.isArray(raw)?raw.filter(x=>x&&typeof x==='object'):[]}
let data=normalizeData(safeParse(localStorage.getItem(KEY),{places:[],items:[]}));let trips=normalizeTrips(safeParse(localStorage.getItem(TRIP_KEY),[]));
let map,markers=[],editing=null,mapAreaFilter=false,mapSelectedTags=[],placeSelectedTags=[],selectedItemTags=[],tripDetailMap=null,tripDetailMarkers=[],userLocationMarker=null;
const CATS={food:{label:'飲食店',genres:['カフェ・喫茶店','スイーツ','パン・ベーカリー','和食','洋食','中華','韓国料理','イタリアン','フレンチ','ラーメン','居酒屋','その他']},shopping:{label:'買い物',genres:['服・ファッション','コスメ・美容','雑貨','家具・インテリア','家電','本・文具','食品・食材','お土産','その他']},sightseeing:{label:'観光・スポット',genres:['観光名所','美術館・博物館','神社・寺','公園・自然','撮影スポット','エンタメ','その他']},hotel:{label:'ホテル・宿',genres:['ホテル','旅館','民宿・ゲストハウス','その他']},other:{label:'その他',genres:['その他']}};
function $(id){return document.getElementById(id)}function esc(s=''){return String(s).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}function yen(n){return n?`¥${Number(n).toLocaleString('ja-JP')}`:'—'}
function persist(){try{data=normalizeData(data);localStorage.setItem(KEY,JSON.stringify(data));render()}catch(e){console.error(e);alert('データを保存できませんでした。写真が多い場合は、写真を減らすかバックアップを確認してください。')}}
function persistTrips(){try{localStorage.setItem(TRIP_KEY,JSON.stringify(trips));renderTrips()}catch(e){console.error(e);alert('旅行データを保存できませんでした。')}}
function catOptions(sel=''){return '<option value="">カテゴリを選択</option>'+Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${k===sel?'selected':''}>${v.label}</option>`).join('')}
function genreOptions(cat,sel=''){let gs=CATS[cat]?.genres||[];return '<option value="">選択してください</option>'+gs.map(g=>`<option ${g===sel?'selected':''}>${esc(g)}</option>`).join('')}
function fillFilter(id){$(id).innerHTML='<option value="">カテゴリすべて</option>'+Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('')}
function initMap(){map=L.map('map').setView([35.6812,139.7671],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);renderMap()}
function markerIcon(p){let emoji='';return L.divIcon({className:'',html:`<div class="pin"><span></span></div>`,iconSize:[34,34],iconAnchor:[17,34],popupAnchor:[0,-30]})}
function filteredPlaces(extraArea=false){let q=($('mapQ')?.value||'').toLowerCase(),cat=$('mapCat')?.value||'',status=$('mapStatus')?.value||'';return data.places.filter(p=>{let its=data.items.filter(i=>i.placeId===p.id);let hay=[p.name,p.address,p.city,p.area,p.genre,p.note,p.stationName,...(p.lines||[]),...(p.tags||[]),...its.map(i=>i.name),...its.map(i=>i.note)].join(' ').toLowerCase();let ok=(!q||hay.includes(q))&&(!cat||p.category===cat)&&(!status||p.status===status)&&(!mapSelectedTags.length||mapSelectedTags.every(tag=>(p.tags||[]).includes(tag)));if(extraArea&&map&&p.lat&&p.lng)ok=ok&&map.getBounds().contains([p.lat,p.lng]);return ok})}
function renderMap(){if(!map)return;markers.forEach(m=>m.remove());markers=[];let arr=filteredPlaces(mapAreaFilter);arr.forEach(p=>{if(!p.anywhere&&p.lat&&p.lng){let m=L.marker([p.lat,p.lng],{icon:markerIcon(p)}).addTo(map).bindPopup(`<b>${esc(p.name)}</b><br>${esc(CATS[p.category]?.label||'')} ${p.genre?'・'+esc(p.genre):''}<br>${esc(displayStoredAddress(p)||'')}${p.price?'<br>'+yen(p.price):''}<br><button class="btn small" onclick="openPlace('${p.id}')">編集</button>`);markers.push(m)}});renderMapCards(arr)}
function renderMapCards(arr=filteredPlaces(mapAreaFilter)){$('mapCards').innerHTML=arr.length?arr.map(placeCard).join(''):'<div class="empty">この条件の場所はありません。</div>'}
function openAppleMap(id){let p=data.places.find(x=>x.id===id);if(!p)return;let hasCoords=!!(p.lat&&p.lng);let q=hasCoords?[p.name,p.address,[p.city,p.area].filter(Boolean).join(' ')].filter(Boolean).join(', '):[p.address,p.city,p.area].filter(Boolean).join(' ');if(!q)q=p.name||'';let ios=/iPhone|iPad|iPod/i.test(navigator.userAgent);let url=ios?(hasCoords?'maps://?ll='+encodeURIComponent(p.lat+','+p.lng)+'&q='+encodeURIComponent(q):'maps://?q='+encodeURIComponent(q)):(hasCoords?'https://maps.apple.com/?ll='+encodeURIComponent(p.lat+','+p.lng)+'&q='+encodeURIComponent(q):'https://maps.apple.com/?address='+encodeURIComponent(q));window.location.href=url}

function placeCard(p){let its=data.items.filter(i=>i.placeId===p.id);let stars='★'.repeat(Number(p.priority||0))+'☆'.repeat(3-Number(p.priority||0));let photo=p.photos?.[0]||'';let rawAddress=String(p.address||'').trim();let fallbackAddress=[p.city,p.area].filter(Boolean).join(' / ');let displayAddress=(rawAddress&&rawAddress!=='住所未登録')?displayStoredAddress(p):fallbackAddress;let hasMap=!p.anywhere&&!!(displayAddress||((p.lat||p.lng)&&p.name));let hasCoords=!p.anywhere&&!!(p.lat&&p.lng);return `<div class="card"><div class="place-head"><div class="place-main"><div class="place-name">${esc(p.name)}</div>${p.anywhere?`<span class="anywhere-badge">どこでもいい${p.anywhereType==='genre'?'・ジャンル':'・お店'}</span>`:''}${hasMap?`<div class="address-row"><button type="button" class="address-link" aria-label="Appleマップで開く" title="Appleマップで開く" onclick="openAppleMap('${p.id}')"><span class="meta address-text">${esc(displayAddress||'地図で開く')}</span><span class="address-arrow" aria-hidden="true">›</span></button>${displayAddress&&!hasCoords?`<div class="meta" style="font-size:10px;margin-top:3px">Want Mapの地図には表示されません（住所のみ登録）</div>`:''}</div>`:`<div class="address-row"><span class="meta address-text">住所未登録</span></div>`}</div><div class="place-side"><span class="status ${p.status==='done'?'done':p.status==='again'?'again':''}">${p.status==='done'?'行った':p.status==='again'?'また行きたい':'行きたい'}</span>${photo?`<img class="place-photo photo-click" onclick="openPhoto('${photo}')" src="${photo}" alt=""><span class="photo-count">写真 ${p.photos.length}枚</span>`:''}</div></div><div class="chips"><span class="chip">${esc(CATS[p.category]?.label||'その他')}</span>${p.genre?`<span class="chip">${esc(p.genre)}</span>`:''}<span class="chip priority">${stars}</span>${p.price?`<span class="chip">予算 ${yen(p.price)}</span>`:''}</div>${!p.anywhere&&p.stationName?`<div class="meta">最寄り駅：${esc(p.stationName)}${p.stationDistance?`（約${Math.round(p.stationDistance)}m）`:''}</div>`:''}${!p.anywhere&&p.lines?.length?`<div class="meta">沿線：${p.lines.map(esc).join(' / ')}</div>`:''}${window.userLocation&&p.lat&&p.lng?`<div class="meta">現在地から約${Math.round(distM(window.userLocation.lat,window.userLocation.lng,p.lat,p.lng)).toLocaleString()}m</div>`:''}${p.visitedAt?`<div class="meta">訪問日：${esc(p.visitedAt)}</div>`:''}${deadlineHtml(p.deadline)}${p.note?`<div class="meta">${esc(p.note)}</div>`:''}${(p.tags||[]).length?`<div class="chips">${p.tags.map(t=>`<span class="chip tag-chip">#${esc(t)}</span>`).join('')}</div>`:''}${urlHtml(p.urls)}<div class="chips">${its.length?its.map(i=>`<button type="button" class="chip linked-item" onclick="openItem('${i.id}')"><span class="type-badge">${i.type==='buy'?'買いたい':i.type==='eat'?'食べたい':'やりたい'}</span>${esc(i.name)}${i.price?' ・ '+yen(i.price):''}${i.status==='done'?' ✓':''}</button>`).join(''):'<span class="meta">やりたいこと未登録</span>'}</div><div class="toolbar">${p.anywhere?`<button class="btn primary" onclick="searchAnywhere('${p.id}')">近くで探す</button>`:''}<button class="btn" onclick="toggleToday('${p.id}')">${p.today?'今日から外す':'今日行く'}</button><button class="btn" onclick="openItem(null,'${p.id}')">＋ したい・ほしい</button><button class="btn" onclick="openPlace('${p.id}')">編集</button><button class="btn danger" onclick="delPlace('${p.id}')">削除</button></div></div>`}

let locationPickerMap=null,locationPickerMarker=null,locationPickerPoint=null,locationPickerOld=null;
function openLocationPicker(){let addr=$('address'),selected=addr?.dataset.selectedGeo?JSON.parse(addr.dataset.selectedGeo):null;locationPickerOld=selected||null;let center=selected?[selected.lat,selected.lng]:(addr?.value&&map?map.getCenter():map?map.getCenter():[35.6812,139.7671]);$('locationPicker').classList.add('show');setTimeout(()=>{if(!locationPickerMap){locationPickerMap=L.map('locationPickerMap').setView(center,selected?17:15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(locationPickerMap);locationPickerMap.on('click',e=>setPickerPoint(e.latlng.lat,e.latlng.lng));}else{locationPickerMap.invalidateSize();locationPickerMap.setView(center,selected?17:15)}if(selected)setPickerPoint(selected.lat,selected.lng);else clearPickerPoint()},120)}
function setPickerPoint(lat,lng){locationPickerPoint={lat:Number(lat),lng:Number(lng)};if(locationPickerMarker){locationPickerMarker.setLatLng([locationPickerPoint.lat,locationPickerPoint.lng])}else{locationPickerMarker=L.marker([locationPickerPoint.lat,locationPickerPoint.lng],{draggable:true,icon:L.divIcon({className:'',html:'<div class="location-picker-marker"></div>',iconSize:[30,30],iconAnchor:[15,30]})}).addTo(locationPickerMap);locationPickerMarker.on('dragend',()=>{let x=locationPickerMarker.getLatLng();locationPickerPoint={lat:x.lat,lng:x.lng};updatePickerStatus()})}updatePickerStatus()}

function formatGeoAddress(x,ad,fallback=''){ad=ad||{};let pref=ad.province||ad.state||ad.prefecture||'';let city=ad.city||ad.town||ad.village||ad.municipality||'';let area=ad.suburb||ad.neighbourhood||ad.quarter||'';let road=ad.road||'';let house=ad.house_number||'';let detail=[area,road,house].filter(Boolean).join('');let main=[pref,city,detail].filter(Boolean).join('');if(main)return main;return String(x?.display_name||fallback||'').trim()}
function displayStoredAddress(p){let raw=String(p?.address||'').trim();if(!raw||raw==='住所未登録')return raw;let prefMatch=raw.match(/(?:北海道|東京都|大阪府|京都府|[一-龥]{2,3}県)/);let pref=prefMatch?.[0]||'';let city=String(p?.city||'').trim();let area=String(p?.area||'').trim();if(pref&&city){let detail=raw.replace(/日本$/,'').replace(/,\s*日本$/,'').split(/,\s*/).filter(Boolean);let withoutCountry=detail.filter(x=>x!==pref&&x!==city&&!x.includes(pref)&&!x.includes(city)&&!/^〒?\d{3}-?\d{4}$/.test(x));let tail=withoutCountry.join('');if(area&&!tail.includes(area))tail=area+tail;return pref+city+tail}return raw}
async function reverseGeocodePickedLocation(){if(!locationPickerPoint){alert('先に地図上でピンの位置を指定してください。');return}let lat=locationPickerPoint.lat,lng=locationPickerPoint.lng;let status=$('locationPickerStatus');status.textContent='住所を検索中…';try{let url='https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat='+encodeURIComponent(lat)+'&lon='+encodeURIComponent(lng)+'&zoom=18&addressdetails=1&accept-language=ja';let r=await fetch(url,{headers:{'Accept':'application/json'}});if(!r.ok)throw new Error('HTTP '+r.status);let x=await r.json();let ad=x.address||{};let address=formatGeoAddress(x,ad);if(!address){status.textContent='住所が見つかりませんでした。';return}let city=ad.city||ad.town||ad.village||ad.municipality||'';let area=ad.suburb||ad.neighbourhood||ad.quarter||ad.city_district||'';let ok=confirm(`この住所を登録しますか？\n\n${address}`);if(!ok){status.textContent='位置を指定してください。';return}let addr=$('address');let old=addr.dataset.selectedGeo?JSON.parse(addr.dataset.selectedGeo):{};let geo={...old,lat,lng,city,area,address};addr.value=address;addr.dataset.selectedGeo=JSON.stringify(geo);delete addr.dataset.manualAddress;$('geo').textContent='✓ ピンの位置から住所を登録しました';$('geo').className='geo-status ok';$('stationStatus').textContent='最寄り駅を取得中…';$('stationStatus').className='geo-status';delete $('stationStatus').dataset.result;closeLocationPicker();await lookupStation(lat,lng)}catch(e){status.textContent='住所の取得に失敗しました。通信状態を確認してください。'}}

async function geocodeStationName(name){
 let q=String(name||'').trim();if(!q)return null;
 if(!/駅$/.test(q))q+='駅';
 let url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&addressdetails=1&accept-language=ja&q='+encodeURIComponent(q+' 日本');
 let r=await fetch(url,{headers:{'Accept':'application/json'}});if(!r.ok)throw new Error('station search '+r.status);
 let a=await r.json();
 a=a.filter(x=>/駅|station/i.test((x.display_name||'')+' '+(x.type||'')+' '+(x.name||'')));
 if(!a.length)return null;
 let x=a[0],ad=x.address||{};return {stationName:x.name||q,stationLat:Number(x.lat),stationLng:Number(x.lon),stationAddress:formatGeoAddress(x,ad,x.display_name||q),stationDistance:0,lines:[]};
}
async function searchStationByName(){
 let el=$('stationStatus'),box=$('stationResults'),name=$('stationNameInput')?.value.trim();
 let addr=$('address');
 let geo=null;
 try{if(addr?.dataset.selectedGeo)geo=JSON.parse(addr.dataset.selectedGeo)}catch(_){geo=null}
 if(!name){name=addr?.value?.trim()||''}
 if(!name&&!geo){el.textContent='駅名または住所を入力してください。';el.className='geo-status err';return}
 el.textContent='駅を検索中…';el.className='geo-status';box.innerHTML='';
 try{
   // 場所検索と同じNominatim検索を最優先で使う。余計な「駅 日本」加工や
   // 駅情報の追加検索をしないので、場所検索と同じ感覚で素早く候補を返す。
   const qParts=[];
   if(name)qParts.push(name);
   if(addr?.value?.trim() && addr.value.trim()!==name)qParts.push(addr.value.trim());
   const q=qParts.join(', ');
   let url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=8&addressdetails=1&accept-language=ja&q='+encodeURIComponent(q);
   let r=await fetch(url,{headers:{'Accept':'application/json'}});
   let arr=r.ok?await r.json():[];
   let stationLike=arr.filter(x=>/駅|station|railway|train_station|public_transport|stop_position/i.test((x.display_name||'')+' '+(x.name||'')+' '+(x.type||'')+' '+(x.class||'')));
   if(stationLike.length){
     renderStationCandidates(stationLike, name.replace(/駅$/,''));
     return;
   }
   // 場所検索で住所が確定しているなら、その座標の周辺駅をフォールバックとして一度だけ検索。
   let lat=geo?.lat,lng=geo?.lng;
   if(!(Number.isFinite(Number(lat))&&Number.isFinite(Number(lng))) && arr[0]){lat=Number(arr[0].lat);lng=Number(arr[0].lon)}
   if(Number.isFinite(Number(lat))&&Number.isFinite(Number(lng))){
     await searchStationsAround(Number(lat),Number(lng));
     return;
   }
   // 住所だけの入力でも場所検索と同じNominatimで1回だけ再検索。
   if(addr?.value?.trim() && addr.value.trim()!==q){
     r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&addressdetails=1&accept-language=ja&q='+encodeURIComponent(addr.value.trim()),{headers:{'Accept':'application/json'}});
     arr=r.ok?await r.json():[];
     stationLike=arr.filter(x=>/駅|station|railway|train_station|public_transport|stop_position/i.test((x.display_name||'')+' '+(x.name||'')+' '+(x.type||'')+' '+(x.class||'')));
     if(stationLike.length){renderStationCandidates(stationLike, name.replace(/駅$/,''));return;}
   }
   el.textContent='駅の候補が見つかりませんでした。';el.className='geo-status err';
 }catch(e){console.error(e);el.textContent='駅の検索に失敗しました。通信状態を確認してください。';el.className='geo-status err';}
}
async function searchStationsAround(lat,lng){
 const el=$('stationStatus'),box=$('stationResults');
 try{
   const q=`[out:json][timeout:10];nwr(around:2500,${lat},${lng})[railway~"^(station|halt)$"];out center tags;`;
   const r=await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q));
   if(!r.ok)throw new Error('overpass '+r.status);
   const els=(await r.json()).elements||[];
   const all=els.map(x=>{const p=x.center||x;return {name:x.tags?.name||'',display_name:x.tags?.name||'',lat:Number(p.lat),lon:Number(p.lon),type:x.tags?.railway||'station',class:'railway',address:{},extratags:x.tags||{},_overpass:true};}).filter(x=>x.name&&isFinite(x.lat)&&isFinite(x.lon));
   all.sort((a,b)=>distM(lat,lng,a.lat,a.lon)-distM(lat,lng,b.lat,b.lon));
   if(!all.length){el.textContent='登録住所の近くに駅が見つかりませんでした。';el.className='geo-status err';return;}
   renderStationCandidates(all, '');
 }catch(e){el.textContent='周辺駅の検索に失敗しました。通信状態を確認してください。';el.className='geo-status err';}
}
function renderStationCandidates(all,bare){
 const el=$('stationStatus'),box=$('stationResults');
 const n=normalizeText(bare||'');
 all=all.filter((x,i,a)=>{const key=(x.lat||'')+','+(x.lon||'')+'|'+(x.name||'');return a.findIndex(y=>((y.lat||'')+','+(y.lon||'')+'|'+(y.name||''))===key)===i});
 all.sort((a,b)=>{
   const score=x=>{let v=0,nm=normalizeText(x.name||'');if(n&&nm===n)v+=150;if(n&&nm.includes(n))v+=60;if(/駅$/.test(x.name||''))v+=10;return -v};
   return score(a)-score(b)
 });

 const cards=window._stationCandidates.map((x,i)=>{
   const ad=x.address||{},pref=ad.province||ad.state||ad.prefecture||'',city=ad.city||ad.town||ad.village||ad.municipality||'';
   const place=[pref,city].filter(Boolean).join('')||x.display_name||'所在地情報なし';
   const tags=x.extratags||{};
   const lines=[tags.network||'',tags.operator||'',tags['railway:ref']||''].flatMap(v=>String(v).split(';')).map(v=>v.trim()).filter(Boolean);
   const lineText=lines.length?lines.join('・'):'路線情報は駅選択後に確認';
   return `<button type="button" class="geo-result" onclick="selectStation(${i})"><b>${esc(x.name||'駅')}</b><span>${esc(lineText+' / '+place)}</span></button>`;
 }).join('');
 box.innerHTML=cards;el.textContent='候補から正しい駅を選択してください。';el.className='geo-status ok';
}

  const payload={app:'Want Map',backupVersion:BACKUP_VERSION,schemaVersion:DATA_SCHEMA_VERSION,exportedAt:new Date().toISOString(),data:{schemaVersion:DATA_SCHEMA_VERSION,places:data.places,items:data.items},trips};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const stamp=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())+'-'+pad(now.getHours())+pad(now.getMinutes())+pad(now.getSeconds());
  const filename='want-map-backup-'+stamp+'.json';
  const file=new File([blob],filename,{type:'application/json'});
  if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({title:'Want Map バックアップ',text:'Want Mapのバックアップファイル',files:[file]}).catch(()=>{});
    return;
  }
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function importBackupFile(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const payload=JSON.parse(reader.result);
      const importedData=payload?.data;
      const importedTrips=payload?.trips;
      if(payload?.app!=='Want Map'||![1,2].includes(Number(payload?.backupVersion||1))||!importedData||!Array.isArray(importedData.places)||!Array.isArray(importedData.items)||!Array.isArray(importedTrips))throw new Error('invalid');
      const ok=confirm('現在のWant Mapのデータはすべて置き換わります。\n\nインポートを実行しますか？');
      if(!ok){$('backupFile').value='';return;}
      data=normalizeData(importedData);
      trips=normalizeTrips(importedTrips);
      localStorage.setItem(KEY,JSON.stringify(data));
      localStorage.setItem(TRIP_KEY,JSON.stringify(trips));
      closeModal();
      render();
      alert('データをインポートしました。');
    }catch(e){alert('バックアップファイルを読み込めませんでした。\nWant MapでエクスポートしたJSONファイルを選択してください。');}
    $('backupFile').value='';
  };
  reader.readAsText(file);
}
