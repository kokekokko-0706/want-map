<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Want Map">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Want Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f6f6f3;--card:#fff;--text:#222;--muted:#7a7a76;--line:#e7e7e2;--soft:#f0f0ec;--accent:#222}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans",Arial,sans-serif}
button,input,select,textarea{font:inherit} button{cursor:pointer}
.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:84px}
header{position:sticky;top:0;z-index:1000;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.title-row{display:flex;align-items:center;justify-content:space-between}.title{font-size:21px;font-weight:750;letter-spacing:-.02em}.sub{font-size:11px;color:var(--muted);margin-top:2px}
.icon-btn{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:#fff}
.nav{display:flex;gap:6px;margin-top:12px}.nav button{flex:1;border:0;background:transparent;border-radius:12px;padding:9px 5px;font-size:12px;color:var(--muted)}.nav button.active{background:#222;color:#fff}
main{padding:12px}.view{display:none}.view.active{display:block}
#map{height:52vh;min-height:350px;border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:1500;border:0;background:#222;color:#fff;border-radius:999px;padding:13px 17px;font-weight:650;box-shadow:0 5px 20px #0002}
.filters{display:grid;grid-template-columns:1.5fr .8fr .8fr;gap:7px;margin-bottom:10px}
input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#aaa}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 11px;font-size:12px}.primary{background:#222;color:#fff;border-color:#222}
.cards{display:grid;gap:9px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px}.place-head{display:flex;justify-content:space-between;gap:10px}.place-name{font-weight:700;font-size:16px}.meta{color:var(--muted);font-size:11px;margin-top:4px}.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.chip{background:var(--soft);border-radius:999px;padding:5px 8px;font-size:11px}
.item{display:flex;gap:10px;align-items:center}.thumb{width:62px;height:62px;object-fit:cover;border-radius:11px;background:#eee;flex:none}.item-main{flex:1;min-width:0}.item-name{font-size:14px;font-weight:650}.item-meta{font-size:11px;color:var(--muted);margin-top:3px}.empty{text-align:center;color:var(--muted);font-size:13px;padding:40px 12px}
.modal{position:fixed;inset:0;background:#0005;z-index:3000;display:none;align-items:flex-end}.modal.show{display:flex}.sheet{width:100%;max-width:720px;margin:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}.sheet h2{font-size:18px;margin:0 0 14px}.form{display:grid;gap:11px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.label{font-size:11px;color:var(--muted);margin:0 0 5px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.photo-preview{width:90px;height:90px;border-radius:12px;object-fit:cover;margin-top:7px}.hint{font-size:10px;color:var(--muted);line-height:1.5}
.section-title{font-size:13px;font-weight:700;margin:17px 2px 8px}
.install{display:none;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;font-size:12px}.install.show{display:block}
@media(min-width:721px){.fab{right:max(16px,calc((100vw - 720px)/2 + 16px))}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="title-row"><div><div class="title">Want Map</div><div class="sub">行きたい場所と、そこで欲しいもの。</div></div><button class="icon-btn" id="backupBtn">↥</button></div>
  <div class="nav"><button class="active" data-view="mapView">🗺️ マップ</button><button data-view="placeView">📍 場所</button><button data-view="itemView">♡ リスト</button></div>
</header>
<main>
  <div id="installBox" class="install"><b>ホーム画面に追加できます</b><br>Safariの「共有」→「ホーム画面に追加」で、普通のアプリのように起動できます。</div>

  <section id="mapView" class="view active">
    <div id="map"></div>
    <div class="toolbar"><button class="btn" id="fitBtn">全体を見る</button><button class="btn" id="currentBtn">現在地</button></div>
    <div class="section-title">行きたい場所</div>
    <div id="mapPlaces" class="cards"></div>
  </section>

  <section id="placeView" class="view">
    <div class="toolbar"><button class="btn primary" id="addPlaceBtn">＋ 場所を追加</button></div>
    <div id="places" class="cards"></div>
  </section>

  <section id="itemView" class="view">
    <div class="filters"><input id="q" placeholder="検索"><select id="type"><option value="">すべて</option><option value="buy">🛍 買いたい</option><option value="eat">🍴 食べたい</option></select><select id="genre"><option value="">ジャンル</option></select></div>
    <div id="items" class="cards"></div>
  </section>
</main>
<button class="fab" id="fab">＋ 追加</button>
</div>

<div id="modal" class="modal"><div class="sheet">
<h2 id="modalTitle"></h2>
<form id="form" class="form"></form>
<div class="actions"><button class="btn" type="button" id="cancel">キャンセル</button><button class="btn primary" type="submit" form="form">保存</button></div>
</div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const KEY='want-map-pwa-v2';let data=JSON.parse(localStorage.getItem(KEY)||'{"places":[],"items":[]}'),map,markers=[],editing=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function persist(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function openModal(title,html){$('modalTitle').textContent=title;$('form').innerHTML=html;$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show');editing=null}
$('cancel').onclick=closeModal;
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.view).classList.add('active');if(b.dataset.view==='mapView')setTimeout(()=>map.invalidateSize(),80)});

function placeForm(p={}){
 return `<div><div class="label">場所の名前 *</div><input name="name" required value="${esc(p.name)}" placeholder="例：中目黒のカフェ"></div>
 <div><div class="label">住所・エリア</div><input name="address" value="${esc(p.address)}" placeholder="例：東京都目黒区"></div>
 <div class="row"><div><div class="label">緯度</div><input name="lat" type="number" step="any" value="${p.lat||''}"></div><div><div class="label">経度</div><input name="lng" type="number" step="any" value="${p.lng||''}"></div></div>
 <button type="button" class="btn" onclick="geo()">📍 現在地から座標を入れる</button>
 <div class="hint">地図にピンを出す場合は緯度・経度を入力。お店の場所を地図で確認したいときは、Google Maps等で座標を確認して入力できます。</div>`;
}
function addPlace(id=null){editing=id?{kind:'place',id}:null;const p=id?data.places.find(x=>x.id===id):{};openModal(id?'場所を編集':'行きたい場所を追加',placeForm(p))}
function geo(){navigator.geolocation?.getCurrentPosition(p=>{$('form').lat.value=p.coords.latitude.toFixed(6);$('form').lng.value=p.coords.longitude.toFixed(6)},()=>alert('位置情報を取得できませんでした。'))}
function itemForm(i={},placeId=''){
 return `<div><div class="label">種類 *</div><select name="type"><option value="buy" ${i.type==='buy'?'selected':''}>🛍 買いたい</option><option value="eat" ${i.type==='eat'?'selected':''}>🍴 食べたい</option></select></div>
 <div><div class="label">名前 *</div><input name="name" required value="${esc(i.name)}" placeholder="例：プリン / バッグ"></div>
 <div><div class="label">ジャンル</div><input name="genre" value="${esc(i.genre)}" placeholder="例：スイーツ、服、雑貨"></div>
 <div><div class="label">場所 *</div><select name="placeId" required>${data.places.map(p=>`<option value="${p.id}" ${(i.placeId||placeId)===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
 <div><div class="label">写真</div><input name="photo" type="file" accept="image/*" capture="environment">${i.photo?`<img class="photo-preview" src="${i.photo}">`:''}</div>
 <div><div class="label">メモ</div><textarea name="note" placeholder="色・サイズ・食べたいメニューなど">${esc(i.note)}</textarea></div>`;
}
function addItem(placeId=''){editing=null;if(!data.places.length)return alert('先に「行きたい場所」を追加してください。');openModal('買いたい・食べたいを追加',itemForm({},placeId))}
function editItem(id){const i=data.items.find(x=>x.id===id);editing={kind:'item',id};openModal('買いたい・食べたいを編集',itemForm(i,i.placeId))}
$('form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);
 if(!editing||editing.kind==='place'){const x={name:f.get('name'),address:f.get('address'),lat:+f.get('lat')||null,lng:+f.get('lng')||null};if(editing?.id)Object.assign(data.places.find(p=>p.id===editing.id),x);else data.places.push({id:uid(),...x})}
 else{const old=data.items.find(i=>i.id===editing.id),file=f.get('photo');let photo=old?.photo||null;if(file?.size)photo=await new Promise((r,j)=>{let x=new FileReader();x.onload=()=>r(x.result);x.onerror=j;x.readAsDataURL(file)});const x={type:f.get('type'),name:f.get('name'),genre:f.get('genre'),placeId:f.get('placeId'),note:f.get('note'),photo};if(editing.id)Object.assign(old,x);else data.items.push({id:uid(),...x})}
 persist();closeModal()};
function delPlace(id){if(confirm('この場所と紐づくリストも削除しますか？')){data.places=data.places.filter(p=>p.id!==id);data.items=data.items.filter(i=>i.placeId!==id);persist()}}
function delItem(id){if(confirm('削除しますか？')){data.items=data.items.filter(i=>i.id!==id);persist()}}
function renderMap(){markers.forEach(m=>m.remove());markers=[];data.places.forEach(p=>{if(p.lat&&p.lng){let m=L.marker([p.lat,p.lng]).addTo(map).bindPopup(`<b>${esc(p.name)}</b><br>${esc(p.address||'')}`);markers.push(m)}})}
function placeCard(p){const its=data.items.filter(i=>i.placeId===p.id);return `<div class="card"><div class="place-head"><div><div class="place-name">${esc(p.name)}</div><div class="meta">${esc(p.address||'')}</div></div><button class="btn" onclick="addItem('${p.id}')">＋</button></div><div class="chips">${its.length?its.map(i=>`<span class="chip">${i.type==='buy'?'🛍':'🍴'} ${esc(i.name)}</span>`).join(''):'<span class="meta">まだ登録なし</span>'}</div><div class="toolbar"><button class="btn" onclick="addPlace('${p.id}')">編集</button><button class="btn" onclick="delPlace('${p.id}')">削除</button></div></div>`}
function renderItems(){let q=$('q').value.toLowerCase(),t=$('type').value,g=$('genre').value;let arr=data.items.filter(i=>{let p=data.places.find(p=>p.id===i.placeId);let hay=[i.name,i.genre,i.note,p?.name,p?.address].join(' ').toLowerCase();return(!q||hay.includes(q))&&(!t||i.type===t)&&(!g||i.genre===g)});$('items').innerHTML=arr.length?arr.map(i=>{let p=data.places.find(p=>p.id===i.placeId);return `<div class="card"><div class="item">${i.photo?`<img class="thumb" src="${i.photo}">`:'<div class="thumb"></div>'}<div class="item-main"><div class="item-name">${i.type==='buy'?'🛍':'🍴'} ${esc(i.name)}</div><div class="item-meta">${esc(p?.name||'場所未設定')} ${i.genre?'・ '+esc(i.genre):''}</div>${i.note?`<div class="item-meta">${esc(i.note)}</div>`:''}</div><button class="btn" onclick="editItem('${i.id}')">編集</button><button class="btn" onclick="delItem('${i.id}')">削除</button></div></div>`}).join(''):'<div class="empty">条件に合うものがありません。</div>'}
function render(){renderMap();$('places').innerHTML=data.places.length?data.places.map(placeCard).join(''):'<div class="empty">まだ場所がありません。</div>';$('mapPlaces').innerHTML=data.places.length?data.places.map(placeCard).join(''):'<div class="empty">「＋追加」から行きたい場所を登録してね。</div>';let gs=[...new Set(data.items.map(i=>i.genre).filter(Boolean))].sort(),old=$('genre').value;$('genre').innerHTML='<option value="">ジャンル</option>'+gs.map(g=>`<option>${esc(g)}</option>`).join('');if(gs.includes(old))$('genre').value=old;renderItems()}
['q','type','genre'].forEach(id=>$(id).addEventListener('input',renderItems));
$('addPlaceBtn').onclick=()=>addPlace();$('fab').onclick=()=>addPlace();$('backupBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='want-map-backup.json';a.click()};
$('fitBtn').onclick=()=>markers.length&&map.fitBounds(L.featureGroup(markers).getBounds().pad(.2));
$('currentBtn').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>map.setView([p.coords.latitude,p.coords.longitude],15));
map=L.map('map').setView([35.6812,139.7671],5);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
if(location.protocol==='https:' && /iPhone|iPad/.test(navigator.userAgent) && !window.navigator.standalone)$('installBox').classList.add('show');
render();
</script>
</body>
</html>
