<body><div class="app">
<header class="top"><div class="title-row"><div><div class="title">Want Map</div><div class="sub">行きたい場所を、地図に残そう。</div></div><div style="display:flex;align-items:center"><button class="manual-link backup-link" onclick="openBackup()">バックアップ</button><button class="manual-link" onclick="openManual()">使い方</button><button class="btn primary" onclick="openPlace()">＋ 追加</button></div></div><div class="tabs"><button class="tab active" data-tab="map"><span class="ico ico-map"></span>地図</button><button class="tab" data-tab="places"><span class="ico ico-pin"></span>場所</button><button class="tab" data-tab="items"><span class="ico ico-list"></span>リスト</button><button class="tab" data-tab="trips"><span class="ico ico-plane"></span>旅行</button></div></header>
<main class="content">
<section id="panel-map" class="panel active"><div class="map-wrap"><div id="map" class="map"></div><div class="map-actions"><button onclick="fitAll()">全体表示</button><button onclick="filterVisible()">このエリアだけ</button><button onclick="showNearby()">現在地周辺</button><button onclick="clearMapFilter()">全て表示</button></div></div><div class="section-title">地図の絞り込み</div><div id="mapTagBar" class="tag-filter-bar"></div><div class="filters"><input id="mapQ" class="input" placeholder="場所・住所・ジャンル・メモ・欲しいものを検索"><select id="mapCat" class="select"><option value="">カテゴリすべて</option></select><select id="mapStatus" class="select"><option value="">ステータスすべて</option><option value="want">行きたい</option><option value="done">行った</option><option value="again">また行きたい</option></select></div><div id="mapCards" class="cards"></div></section>
<section id="panel-places" class="panel"><div id="placeTagBar" class="tag-filter-bar"></div><div class="filters"><input id="placeQ" class="input" placeholder="場所・住所・ジャンル・メモ・欲しいもの・駅名・路線を検索"><select id="placeCat" class="select"><option value="">カテゴリすべて</option></select><select id="placeStatus" class="select"><option value="">ステータスすべて</option><option value="want">行きたい</option><option value="done">行った</option><option value="again">また行きたい</option></select><select id="placeDeadline" class="select"><option value="">期限すべて</option><option value="set">期限あり</option><option value="soon">期限が近い</option><option value="overdue">期限切れ</option></select></div><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 10px"><span class="label" style="margin:0">並び順</span><select id="placeSort" class="select" style="max-width:220px"><option value="registered">登録順（新しい順）</option><option value="name">名前順</option><option value="address">住所順</option><option value="genre">ジャンル順</option><option value="line">路線順</option><option value="station">最寄り駅順</option><option value="priority">優先度順</option><option value="price">予算順</option><option value="visited">訪問日順</option><option value="deadline">期限順</option><option value="distance">現在地から近い順</option></select></div><div class="quickbar"><button class="btn" onclick="showNearby()">現在地から近い場所を表示</button><button class="btn" onclick="showStationSearch()">駅・路線から探す</button><button class="btn primary" onclick="openTodayPanel()">今日行く場所</button></div><div id="nearStatus" class="near-status"></div><div id="stationQuick" style="display:none;margin-bottom:10px"><div class="search-row"><input id="stationQ" class="input" placeholder="駅名・路線名で検索"><button class="btn" onclick="applyStationSearch()">検索</button></div></div><div id="todayPanel" style="display:none" class="route-box"></div><div id="places" class="cards"></div></section>
<section id="panel-items" class="panel"><div class="summary" id="stats"></div><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><div class="section-title" style="margin:16px 0 9px">したい・ほしい</div><button class="btn primary" onclick="openItem()">＋ リストを追加</button></div><div class="filters"><input id="itemQ" class="input" placeholder="検索"><select id="itemType" class="select"><option value="">種類すべて</option><option value="buy">買いたい</option><option value="eat">食べたい</option><option value="do">やりたい</option></select><select id="itemStatus" class="select"><option value="">ステータスすべて</option><option value="want">未完了</option><option value="done">済み</option></select><select id="itemFavorite" class="select"><option value="">お気に入りすべて</option><option value="yes">お気に入りのみ</option></select><select id="itemDeadline" class="select"><option value="">期限すべて</option><option value="set">期限あり</option><option value="soon">期限が近い</option><option value="overdue">期限切れ</option></select><select id="itemSort" class="select"><option value="registered">登録順</option><option value="name">名前順</option><option value="type">種類順</option><option value="place">場所順</option><option value="priceAsc">価格の安い順</option><option value="priceDesc">価格の高い順</option><option value="status">未完了→済み</option><option value="deadline">期限順</option></select></div><div id="items" class="cards"></div></section>
<section id="panel-trips" class="panel"><div class="section-title">旅行・お出かけ</div><button class="btn primary" onclick="openTrip()">＋ 旅行を追加</button><div id="trips" class="cards" style="margin-top:10px"></div><div class="footer-note">旅行に場所を追加すると、その旅行に行きたいスポットをまとめて見られます。</div></section>
</main></div>
<input id="backupFile" type="file" accept="application/json,.json" style="display:none" onchange="importBackupFile(this.files[0])"><div id="modal" class="modal"><div class="sheet"><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const KEY='want-map-pwa-v2';const TRIP_KEY='want-map-trips-v1';
let data=JSON.parse(localStorage.getItem(KEY)||'{"places":[],"items":[]}');let trips=JSON.parse(localStorage.getItem(TRIP_KEY)||'[]');let map,markers=[],editing=null,mapAreaFilter=false,selectedTag='';
const CATS={food:{label:'飲食店',genres:['カフェ・喫茶店','スイーツ','パン・ベーカリー','和食','洋食','中華','韓国料理','イタリアン','フレンチ','ラーメン','居酒屋','その他']},shopping:{label:'買い物',genres:['服・ファッション','コスメ・美容','雑貨','家具・インテリア','家電','本・文具','食品・食材','お土産','その他']},sightseeing:{label:'観光・スポット',genres:['観光名所','美術館・博物館','神社・寺','公園・自然','撮影スポット','エンタメ','その他']},hotel:{label:'ホテル・宿',genres:['ホテル','旅館','民宿・ゲストハウス','その他']},other:{label:'その他',genres:['その他']}};
function $(id){return document.getElementById(id)}function esc(s=''){return String(s).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}function yen(n){return n?`¥${Number(n).toLocaleString('ja-JP')}`:'—'}function persist(){localStorage.setItem(KEY,JSON.stringify(data));render()}function persistTrips(){localStorage.setItem(TRIP_KEY,JSON.stringify(trips));renderTrips()}
function catOptions(sel=''){return '<option value="">カテゴリを選択</option>'+Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${k===sel?'selected':''}>${v.label}</option>`).join('')}
function genreOptions(cat,sel=''){let gs=CATS[cat]?.genres||[];return '<option value="">選択してください</option>'+gs.map(g=>`<option ${g===sel?'selected':''}>${esc(g)}</option>`).join('')}
function fillFilter(id){$(id).innerHTML='<option value="">カテゴリすべて</option>'+Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('')}
function initMap(){map=L.map('map').setView([35.6812,139.7671],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);renderMap()}
function markerIcon(p){let emoji='';return L.divIcon({className:'',html:`<div class="pin"><span></span></div>`,iconSize:[34,34],iconAnchor:[17,34],popupAnchor:[0,-30]})}
function filteredPlaces(extraArea=false){let q=($('mapQ')?.value||'').toLowerCase(),cat=$('mapCat')?.value||'',status=$('mapStatus')?.value||'';return data.places.filter(p=>{let its=data.items.filter(i=>i.placeId===p.id);let hay=[p.name,p.address,p.city,p.area,p.genre,p.note,p.stationName,...(p.lines||[]),...(p.tags||[]),...its.map(i=>i.name),...its.map(i=>i.note)].join(' ').toLowerCase();let ok=(!q||hay.includes(q))&&(!cat||p.category===cat)&&(!status||p.status===status)&&(!selectedTag||(p.tags||[]).includes(selectedTag));if(extraArea&&map&&p.lat&&p.lng)ok=ok&&map.getBounds().contains([p.lat,p.lng]);return ok})}

function placeCard(p){let its=data.items.filter(i=>i.placeId===p.id);let stars='★'.repeat(Number(p.priority||0))+'☆'.repeat(3-Number(p.priority||0));let photo=p.photos?.[0]||'';return `<div class="card"><div class="place-head"><div class="place-main"><div class="place-name">${esc(p.name)}</div>${p.anywhere?`<span class="anywhere-badge">どこでもいい${p.anywhereType==='genre'?'・ジャンル':'・お店'}</span>`:''}<div class="meta">${esc(p.address||'住所未登録')}</div>${p.city||p.area?`<div class="meta">${esc([p.city,p.area].filter(Boolean).join(' / '))}</div>`:''}</div><div class="place-side"><span class="status ${p.status==='done'?'done':p.status==='again'?'again':''}">${p.status==='done'?'行った':p.status==='again'?'また行きたい':'行きたい'}</span>${photo?`<img class="place-photo photo-click" onclick="openPhoto('${photo}')" src="${photo}" alt=""><span class="photo-count">写真 ${p.photos.length}枚</span>`:''}</div></div><div class="chips"><span class="chip">${esc(CATS[p.category]?.label||'その他')}</span>${p.genre?`<span class="chip">${esc(p.genre)}</span>`:''}<span class="chip priority">${stars}</span>${p.price?`<span class="chip">予算 ${yen(p.price)}</span>`:''}</div>${p.stationName?`<div class="meta">最寄り駅：${esc(p.stationName)}${p.stationDistance?`（約${Math.round(p.stationDistance)}m）`:''}</div>`:''}${p.lines?.length?`<div class="meta">沿線：${p.lines.map(esc).join(' / ')}</div>`:''}${window.userLocation&&p.lat&&p.lng?`<div class="meta">現在地から約${Math.round(distM(window.userLocation.lat,window.userLocation.lng,p.lat,p.lng)).toLocaleString()}m</div>`:''}${p.visitedAt?`<div class="meta">訪問日：${esc(p.visitedAt)}</div>`:''}${deadlineHtml(p.deadline)}${p.note?`<div class="meta">${esc(p.note)}</div>`:''}${(p.tags||[]).length?`<div class="chips">${p.tags.map(t=>`<span class="chip tag-chip">#${esc(t)}</span>`).join('')}</div>`:''}${urlHtml(p.urls)}<div class="chips">${its.length?its.map(i=>`<span class="chip"><span class="type-badge">${i.type==='buy'?'買いたい':i.type==='eat'?'食べたい':'やりたい'}</span>${esc(i.name)}${i.price?' ・ '+ function openPlace(id=null){editing={kind:'place',id};let p=id?data.places.find(x=>x.id===id):{status:'want',priority:1};$('modalTitle').textContent=id?'場所を編集':'行きたい場所を追加';$('modalBody').innerHTML=`<form id="placeForm" class="form"><div><div class="label">店名・スポット名 *</div><input class="input" name="name" value="${esc(p.name||'')}" placeholder="例：ダイソー、カフェ、本屋" required></div><div class="label">登録方法</div><div class="row"><label class="chip" style="padding:10px;cursor:pointer"><input type="radio" name="locationMode" value="fixed" ${!p.anywhere?'checked':''}> 場所を指定</label><label class="chip" style="padding:10px;cursor:pointer"><input type="radio" name="locationMode" value="anywhere" ${p.anywhere?'checked':''}> どこでもいい</label></div><div id="fixedLocationFields" style="display:${p.anywhere?'none':'block'}"><div class="label">場所名・住所</div><div class="search-row"><input class="input" id="address" name="address" value="${esc(p.address||'')}" placeholder="住所を入力（例：東京都渋谷区○○1-2-3）"><button type="button" class="btn primary geo-search-btn" id="geoBtn"><span class="ico ico-search"></span> 検索</button></div><div class="geo-help">住所を入力して検索できます。住所を空欄にしても、上の「場所名」から検索できます。候補を選ばなくても、保存時に先頭候補を自動取得します。</div><div id="geo" class="geo-status"></div><div id="geoResults" class="geo-results"></div></div></div><div id="anywhereHelp" class="geo-help" style="display:${p.anywhere?'block':'none'}">住所を決めずに登録できます。「どのお店でもいい」のか「このジャンルならどこでもいい」のかを選べます。</div><div id="anywhereType" class="anywhere-type" style="display:${p.anywhere?'block':'none'}"><div class="anywhere-type-title">「どこでもいい」の種類</div><div class="row"><label class="chip" style="padding:10px;cursor:pointer"><input type="radio" name="anywhereType" value="shop" ${p.anywhereType!=='genre'?'checked':''}> このお店ならどこでもいい</label><label class="chip" style="padding:10px;cursor:pointer"><input type="radio" name="anywhereType" value="genre" ${p.anywhereType==='genre'?'checked':''}> このジャンルならどこでもいい</label></div><div class="geo-help" style="margin:6px 0 0">例：「ダイソー」はお </div><div><div class="label">URL</div><div id="placeUrls" class="url-fields"></div><button type="button" class="btn" onclick="addUrlField('placeUrls')">＋ URLを追加</button></div><div><div class="label">メモ</div><textarea class="textarea" name="note" placeholder="予約・注意点・一緒に行く人など">${esc(p.note||'')}</textarea></div><div><div class="label">写真（複数可）</div><input class="input" type="file" id="placePhotos" accept="image/*" multiple><div id="placePhotosPreview" class="photos">${(p.photos||[]).map((s,i)=>`<div class="photo-box"><img class="photo-preview" src="${s}"><button type="button" onclick="removeTempPhoto(${i})">×</button></div>`).join('')}</div></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">キャンセル</button><button class="btn primary">保存</button></div></form>`;$('modal').classList.add('show');bindPlaceForm(p);(p.urls||[]).forEach(u=>addUrlField('placeUrls',u.label,u.url));if(p.lat&&p.lng){$('geo').textContent='✓ 登録済みの地図位置があります';$('geo').className='geo-status ok';$('address').dataset.selectedGeo=JSON.stringify({lat:p.lat,lng:p.lng,city:p.city||'',area:p.area||''});if(p.stationName){let r={stationName:p.stationName,stationDistance:p.stationDistance||0,lines:p.lines||[]};$('stationStatus').dataset.result=JSON.stringify(r);$('stationStatus').textContent=`✓ ${p.stationName}${p.stationDistance?`（約${Math.round(p.stationDistance)}m）`:''}${p.lines?.length?' / '+p.lines.join('・'):''}`;$('stationStatus').className='geo-status ok'}}}
function bindPlaceForm(old){let cat=$('category'),genre=$('genre');cat.onchange=()=>genre.innerHTML=genreOptions(cat.value);document.querySelectorAll('input[name=locationMode]').forEach(r=>r.onchange=()=>{let any=r.value==='anywhere'&&r.checked;if($('fixedLocationFields'))$('fixedLocationFields').style.display=any?'none':'block';if($('anywhereHelp'))$('anywhereHelp').style.display=any?'block':'none';if($('anywhereType'))$('anywhereType').style.display=any?'block':'none';let a=$('address');if(a)a.required=!any});let initAny=!!old.anywhere;if($('address'))$('address').required=false;$('geoBtn').onclick=()=>searchAddress();$('stationBtn').onclick=()=>lookupStationForForm();$('address').addEventListener('input',()=>delete $('address').dataset.selectedGeo);document.querySelector('#placeForm [name="name"]')?.addEventListener('input',()=>delete $('address').dataset.selectedGeo);$('address').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchAddress()}});$('placePhotos').addEventListener('change',e=>readFiles(e.target.files,'placePhotosPreview',old.photos||[]));$('placeForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),isAnywhere=f.get('locationMode')==='anywhere',addr=String(f.get('address')||'').trim(),selected=$('address').dataset.selectedGeo?JSON.parse($('address').dataset.selectedGeo):null;let geo=selected;if(!isAnywhere&&!geo){geo=await searchAddress(true);if(!geo){$('geo').textContent='場所名または住所を検索して、位置を取得してください。';$('geo').className='geo-status err';return}}let photos=await collectPhotos(old.photos||[],'placePhotosPreview');let status=f.get('status'),visitedAt=f.get('visitedAt')||'';if(status==='done'&&!visitedAt)visitedAt=new Date().toISOString().slice(0,10);let station=old.stationName?{stationName:old.stationName,stationDistance:old.stationDistance,lines:old.lines||[]}:{};if($('stationStatus')?.dataset.result)station=JSON.parse($('stationStatus').dataset.result);let x={name:f.get('name').trim(),anywhere:isAnywhere,anywhereType:isAnywhere?(f.get('anywhereType')||old.anywhereType||'shop'):'',address:isAnywhere?'':addr,category:f.get('category'),genre:f.get('genre'),status,priority:Number(f.get('priority')||0),visitedAt,deadline:f.get('deadline')||'',favorite:f.get('favorite')==='on',price:Number(f.get('price')||0),tripId:f.get('tripId')||'',tags:String(f.get('tags')||'').split(',').map(s=>s.trim()).filter(Boolean),urls:collectUrls('placeUrls'),note:f.get('note')||'',photos,lat:isAnywhere?(old.lat??null):(geo?.lat??old.lat??null),lng:isAnywhere?(old.lng??null):(geo?.lng??old.lng??null),city:isAnywhere?'':(geo?.city??old.city??''),area:isAnywhere?'':(geo?.area??old.area??''),stationName:isAnywhere?(old.stationName||''):(station.stationName||''),stationDistance:isAnywhere?(old.stationDistance||0):(station.stationDistance||0),lines:isAnywhere?(old.lines||[]):(station.lines||[]),today:old.today||false};let nn=normalizeText(x.name),na=normalizeText(x.address);let dup=data.places.find(z=>z.id!==editing.id&&((nn&&normalizeText(z.name)===nn)||(na&&normalizeText(z.address)===na)));if(dup&&!confirm(`似た場所がすでに登録されています。\n\n${dup.name}${dup.address?'\n'+dup.address:''}\n\nこのまま登録しますか？`))return;if(editing.id)Object.assign(data.places.find(p=>p.id===editing.id),x);else data.places.push({id:uid(),...x});closeModal();persist()}}
async function searchAddress(autoPick=false){let addr=$('address')?.value.trim(),name=document.querySelector('#placeForm [name="name"]')?.value.trim();if(!addr&&!name){$('geo').textContent='場所名または住所を入力してください。';$('geo').className='geo-status err';return null;}$('geo').textContent='場所を検索中…';$('geo').className='geo-status';$('geoResults').innerHTML='';try{let q=[name,addr].filter(Boolean).join(', ');let url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&addressdetails=1&accept-language=ja&q='+encodeURIComponent(q);let r=await fetch(url,{headers:{'Accept':'application/json'}});if(!r.ok)throw new Error('HTTP '+r.status);let a=await r.json();if(!a.length&&name&&addr){url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&addressdetails=1&accept-language=ja&q='+encodeURIComponent(addr);r=await fetch(url,{headers:{'Accept':'application/json'}});a=await r.json()}if(!a.length){$('geo').textContent='候補が見つかりませんでした。住所を少し簡略化して再検索してください。';$('geo').className='geo-status err';return null}if(autoPick){let x=a[0],ad=x.address||{};let geo={lat:Number(x.lat),lng:Number(x.lon),city:ad.city||ad.town||ad.village||ad.municipality||'',area:ad.suburb||ad.neighbourhood||ad.quarter||ad.city_district||''};$('address').dataset.selectedGeo=JSON.stringify(geo);$('geo').textContent='✓ 地図上の位置を取得しました';$('geo').className='geo-status ok';return geo}$('geo').textContent=`候補が${a.length}件見つかりました。正しい場所を選択してください。`;$('geo').className='geo-status ok';$('geoResults').innerHTML=a.map((x,i)=>`<button type="button" class="geo-result" onclick="selectGeo(${i})"><b>${esc(x.name||'候補')}</b><span>${esc(x.display_name||'')}</span></button>`).join('');window._geoCandidates=a;return null}catch(e){$('geo').textContent='位置検索に失敗しました。通信状態を確認してください。';$('geo').className='geo-status err';return null}}
function selectGeo(i){let x=window._geoCandidates?.[i];if(!x)return;let ad=x.address||{};let geo={lat:Number(x.lat),lng:Number(x.lon),city:ad.city||ad.town||ad.village||ad.municipality||'',area:ad.suburb||ad.neighbourhood||ad.quarter||ad.city_district||''};$('address').dataset.selectedGeo=JSON.stringify(geo);$('geoResults').innerHTML='';$('geo').textContent='✓ この場所を選択しました。保存すると地図にピンが付きます';$('geo').className='geo-status ok';lookupStation(geo.lat,geo.lng)}
async function lookupStationForForm(){let g=$('address')?.dataset.selectedGeo;if(!g){$('stationStatus').textContent='先に住所を検索して候補を選択してください。';$('stationStatus').className='geo-status err';return}let geo=JSON.parse(g);await lookupStation(geo.lat,geo.lng)}
async function lookupStation(lat,lng){let el=$('stationStatus');if(!el)return;el.textContent='最寄り駅・路線を検索中…';el.className='geo-status';try{let q=`[out:json][timeout:20];node(around:1800,${lat},${lng})[railway~"^(station|halt)$"];out body;`;let r=await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q));if(!r.ok)throw new Error('station '+r.status);let a=(await r.json()).elements||[];if(!a.length){el.textContent='近くの駅が見つかりませんでした。';el.className='geo-status err';return}a.sort((x,y)=>distM(lat,lng,Number(x.lat),Number(x.lon))-distM(lat,lng,Number(y.lat),Number(y.lon)));let st=a[0],distance=distM(lat,lng,Number(st.lat),Number(st.lon));let q2=`[out:json][timeout:20];node(${st.id});rel(bn)["type"="route"]["route"~"^(train|subway|tram|light_rail|monorail)$"];out tags;`;let r2=await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q2));let rels=r2.ok?(await r2.json()).elements||[]:[];let lines=[...new Set(rels.map(x=>x.tags?.name||x.tags?.ref).filter(Boolean))];let result={stationName:st.tags?.name||'最寄り駅',stationDistance:distance,lines};el.dataset.result=JSON.stringify(result);el.textContent=`✓ ${result.stationName}（約${Math.round(distance)}m）${lines.length?' / '+lines.join('・'):''}`;el.className='geo-status ok'}catch(e){el.textContent='駅・路線の検索に失敗しました。後から再検索できます。';el.className='geo-status err'}}
function distM(a,b,c,d){let R=6371000,to=x=>x*Math.PI/180,da=to(c-a),db=to(d-b),x=Math.sin(da/2)**2+Math.cos(to(a))*Math.cos(to(c))*Math.sin(db/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function readFiles(files,previewId,existing){let box=$(previewId);[...files].forEach(file=>{let r=new FileReader();r.onload=()=>{let d=document.createElement('div');d.className='photo-box';d.dataset.temp=r.result;d.innerHTML=`<img class="photo-preview" src="${r.result}"><button type="button">×</button>`;d.querySelector('button').onclick=()=>d.remove();box.appendChild(d)};r.readAsDataURL(file)})}
async function collectPhotos(existing,previewId){let arr=[];document.querySelectorAll('#'+previewId+' .photo-box').forEach(b=>arr.push(b.dataset.temp||b.querySelector('img')?.src));return arr.filter(Boolean)}
function removeTempPhoto(i){let boxes=document.querySelectorAll('#placePhotosPreview .photo-box');if(boxes[i])boxes[i].remove()}
function openItem(id=null,placeId=''){editing={kind:'item',id};let i=id?data.items.find(x=>x.id===id):{type:'buy',placeId:placeId||'',status:'want'};$('modalTitle').textContent=id?'リストを編集':'したい・ほしいを追加';$('modalBody').innerHTML=`<form id="itemForm" class="form"><div><div class="label">内容 *</div><input class="input" name="name" value="${esc(i.name||'')}" placeholder="例：クロッフル、コスメ" required></div><div class="row"><div><div class="label">種類</div><select class="select" name="type"><option value="buy" ${i.type==='buy'?'selected':''}>買いたい</option><option value="eat" ${i.type==='eat'?'selected':''}>食べたい</option><option value="do" ${i.type==='do'?'selected':''}>やりたい</option></select></div><div><div class="label">場所 <span style="font-size:10px">（任意）</span></div><select class="select" name="placeId"><option value="" ${!i.placeId?'selected':''}>場所を設定しない</option>${data.places.map(p=>`<option value="${p.id}" ${i.placeId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><div class="hint">あとから場所を追加・変更できます。</div></div></div><div class="row"><div><div class="label">価格・予算（円）</div><input class="input" type="number" min="0" name="price" value="${i.price||''}" placeholder="例：3000"></div><div><div class="label">ステータス</div><select class="select" name="status"><option value="want" ${i.status!=='done'?'selected':''}>行きたい</option><option value="done" ${i.status==='done'?'selected':''}>済み</option></select></div></div><div><div class="label">期限</div><input class="input date-input" type="date" name="deadline" value="${i.deadline||''}"></div><div><div class="label">メモ</div><textarea class="textarea" name="note">${esc(i.note||'')}</textarea></div><div><div class="label">URL</div><div id="itemUrls" class="url-fields"></div><button type="button" class="btn" onclick="addUrlField('itemUrls')">＋ URLを追加</button></div><div><div class="label">写真</div><input class="input" type="file" name="photo" accept="image/*"><div class="photos">${i.photo?`<img class="photo-preview" src="${i.photo}">`:'' function deadlineState(v){if(!v)return '';let d=new Date(v+'T23:59:59');let now=new Date();let diff=Math.ceil((d-now)/86400000);return {date:v,diff,overdue:diff<0,soon:diff>=0&&diff<=7};}

function exportBackup(){
  const payload={app:'Want Map',backupVersion:1,exportedAt:new Date().toISOString(),data:{places:data.places,items:data.items},trips};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const filename='want-map-backup-'+new Date().toISOString().slice(0,10)+'.json';
  const file=new File([blob],filename,{type:'application/json'});
  if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({title:'Want Map バックアップ',text:'Want Mapのバックアップファイル',files:[file]}).catch(()=>{});
    return;
  }
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function importBackupFile(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const payload=JSON.parse(reader.result);
      const importedData=payload?.data;
      const importedTrips=payload?.trips;
      if(payload?.app!=='Want Map'||!importedData||!Array.isArray(importedData.places)||!Array.isArray(importedData.items)||!Array.isArray(importedTrips))throw new Error('invalid');
      const ok=confirm('現在のWant Mapのデータはすべて置き換わります。\n\nインポートを実行しますか？');
      if(!ok){$('backupFile').value='';return;}
      localStorage.setItem(KEY,JSON.stringify({places:importedData.places,items:importedData.items}));
      localStorage.setItem(TRIP_KEY,JSON.stringify(importedTrips));
      data={places:importedData.places,items:importedData.items};
      trips=importedTrips;
      closeModal();
      render();
      alert('データをインポートしました。');
    }catch(e){alert('バックアップファイルを読み込めませんでした。\nWant MapでエクスポートしたJSONファイルを選択してください。');}
    $('backupFile').value='';
  };
  reader.readAsText(file);
}

$('modalBody').innerHTML=`<div class="manual-body">
<div class="manual-intro">Want Mapは「いつか行きたい・やってみたい」を忘れないための、自分用の記録アプリです。住所のある場所から、買いたいもの・食べたいもの・やりたいことまでまとめて管理できます。</div>
<div class="manual-section"><h3>1. まず「場所」を登録</h3><p>上部の「＋ 追加」から、行きたい店・スポット・施設を登録します。</p><ul><li><b>店名・スポット名</b>：必須です。</li><li><b>住所</b>：住所を入力して「検索」→候補を選ぶと地図上のピンが決まります。</li><li><b>カテゴリ・ジャンル</b>：検索や絞り込みに使えます。</li><li><b>ステータス</b>：「行きたい」「行った」「また行きたい」の3つ。</li><li><b>優先度・価格・タグ・メモ・写真</b>：必要なものだけ登録できます。</li></ul></div>
<div class="manual-section"><h3>2. 「どこでもいい」を使う</h3><p>住所が決まっていない場合は「どこでもいい」を選べます。さらに「このお店ならどこでもいい」か「このジャンルならどこでもいい」かを選べます。</p><p>例えば「ダイソー」はお店、「本屋」はジャンルです。ジャンルの場合も、通常の場所と同じように「したい・ほしい」を紐付けられます。</p></div><div class="manual-section"><h3>3. 地図</h3><p>登録した場所は地図上にピンで表示されます。ピンをタップすると場所の情報を確認できます。</p><p>検索・カテゴリ・ステータスで地図上の表示を絞り込めます。「現在地から近い順」などの機能も使えます。</p></div>
<div class="manual-section"><h3>4. 場所</h3><p>登録した場所を一覧で確認できます。検索、カテゴリ、ステータス、期限、名前・住所・ジャンル・駅・優先度・価格・訪問日などで並べ替えられます。</p><p>写真を登録した場所はカードの右側に写真が表示され、タップすると拡大できます。</p></div>
<div class="manual-section"><h3>5. リスト</h3><p>「買いたい・食べたい・やりたい」を管理するリストです。場所は任意で、あとから追加・変更できます。</p><p>検索・種類・ステータス・お気に入り・期限で絞り込み、登録順・名前順・種類順・場所順・価格順・期限順などで並び替えできます。</p><p>例えば「○○店で買いたい」のように場所に紐づけても、「いつか買いたい」のように場所なしでも登録できます。あとから場所を追加できます。チェックを入れると完了として管理できます。お気に入りや期限も設定できます。</p></div>
<div class="manual-section"><h3>6. 旅行</h3><p>旅行ごとに名前・日付・予算・メモを登録できます。場所を旅行に紐づけると、その旅行の行き先としてまとめて確認できます。</p></div>
<div class="manual-section"><h3>7. 「今日行く」を使う</h3><p>今日行きたい場所を選んでまとめると、順番を確認したり、登録した場所からルートを作ってGoogle Mapsに渡したりできます。</p></div>
<div class="manual-section"><h3>8. 周辺検索</h3><p>「周辺から探す」では、現在地の近くにある店舗・施設を探せます。店舗情報はOpenStreetMapのデータを利用するため、登録されていない店舗が表示されない場合があります。</p></div>
<div class="manual-section"><h3>9. データについて</h3><p>Want Mapの登録データはこの端末のブラウザ内に保存されます。別のスマートフォンへ自動同期はされません。</p><p>右上の「バックアップ」からデータをエクスポートすると、場所・リスト・旅行などをバックアップできます。別の端末では「データをインポート」からバックアップファイルを選んで復元できます。</p><p><b>インポートは現在のデータをすべて置き換えます。</b>復元前に必要なら現在のデータもエクスポートしてください。</p></div>
<div class="manual-section"><h3>おすすめの使い分け</h3><p><b>住所が決まっている場所</b> →「場所」に登録。</p><p><b>買いたい・食べたい・やりたいこと</b> →「リスト」に登録。</p><p><b>旅行でまとめたい場所</b> →「旅行」に紐づける。</p><p><b>今日行く場所</b> →「今日行く」にまとめてルート化。</p></div>
