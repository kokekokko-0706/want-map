isplay:flex;flex-direction:column;align-items:flex-end;gap:7px}.place-photo{width:100px;height:100px;object-fit:cover;border-radius:12px;background:#eee;display:block}.photo-count{font-size:9px;color:#777;background:#f3f3f3;border-radius:999px;padding:3px 6px;margin-top:-2px}.place-name,.item-name{font-size:15px;font-weight:750}.meta,.item-meta{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.45}.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.chip{background:#f1f5f6;border-radius:999px;padding:5px 8px;font-size:10px;color:#506066}.status{font-size:10px;padding:5px 8px;border-radius:999px;background:#eef2f3;color:#4e6267}.status.done{background:#e8f5ed;color:#25633c}.status.again{background:#e7f2f4;color:#315f68}.priority{letter-spacing:1px}.toolbar{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.btn{border:1px solid #ddd;background:#fff;border-radius:9px;padding:8px 10px;font-size:11px}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.danger{color:#a33}.btn.small{padding:6px 8px}.thumb{width:68px;height:68px;object-fit:cover;border-radius:11px;background:#eee;flex:none}.empty{text-align:center;color:var(--muted);font-size:13px;padding:38px 12px}.section-title{font-size:16px;font-weight:800;margin:16px 0 9px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f7f7f7;border-radius:12px;padding:11px}.stat b{display:block;font-size:18px}.stat span{font-size:10px;color:var(--muted)}.trip-card{display:flex;justify-content:space-between;gap:10px;align-items:center}.trip-info{flex:1}.trip-name{font-weight:750}.price{font-weight:700;font-size:12px}.modal{position:fixed;inset:0;background:#0006;z-index:3000;display:none;align-items:flex-end}.modal.show{display:flex}.sheet{width:100%;max-width:720px;margin:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));max-height:94vh;overflow:auto}.sheet h2{font-size:18px;margin:0 0 14px}.form{display:grid;gap:11px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.label{font-size:11px;color:var(--muted);margin:0 0 5px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.photo-preview{width:78px;height:78px;border-radius:12px;object-fit:cover}.photos{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.photo-box{position:relative}.photo-box button{position:absolute;right:-4px;top:-4px;border:0;border-radius:50%;width:22px;height:22px;background:#111;color:#fff}.hint,.geo-status{font-size:10px;color:var(--muted);line-height:1.5}.geo-status.ok{color:#286b43}.geo-status.err{color:#a33}.footer-note{font-size:10px;color:#999;margin-top:14px}.leaflet-div-icon{background:transparent;border:0}.pin{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;border:3px solid #fff;box-shadow:0 2px 7px #0003}.pin span{transform:rotate(45deg);font-size:0}.pin span:before{content:"";display:block;width:8px;height:8px;border:2px solid #fff;border-radius:50%}.range{display:flex;align-items:center;gap:8px}.range input{flex:1}.today-badge{font-size:10px;padding:5px 8px;border-radius:999px;background:#eef5ff;color:#245b9e}.tag-chip{background:#eef1f4}.photo-click{cursor:pointer}.quickbar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.near-status{font-size:11px;color:#777;margin:6px 0}.route-box{background:#f7f7f7;border-radius:12px;padding:10px;margin-top:8px}.today-list{display:grid;gap:7px;margin-top:8px}.today-row{display:flex;align-items:center;gap:8px;border:1px solid #eee;border-radius:10px;padding:8px}.today-row .name{flex:1;font-size:12px;font-weight:650}
@media(max-width:560px){.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.summary{grid-template-columns:1fr 1fr 1fr}.row{grid-template-columns:1fr 1fr}}
.search-row{display:flex;gap:8px;align-items:stretch}.search-row .input{flex:1}.geo-help{font-size:12px;color:#777;margin-top:6px}.geo-results{display:grid;gap:6px;margin-top:8px}.check-item{display:inline-flex;align-items:center;gap:6px;font-size:13px}.geo-result{display:flex;flex-direction:column;text-align:left;padding:10px 12px;border:1px solid #ddd;border-radius:12px;background:#fff}.geo-result span{font-size:12px;color:#666;margin-top:3px}.geo-status{margin-top:7px;font-size:13px}.geo-status.ok{color:#16734a}.geo-status.err{color:#b42318}
.ico{width:15px;height:15px;display:inline-block;position:relative;flex:none;color:currentColor}.ico-map:before{content:"";position:absolute;inset:2px 1px;border:1.6px solid currentColor;border-radius:2px;transform:skewY(-8deg)}.ico-map:after{content:"";position:absolute;left:6px;top:1px;width:1.5px;height:13px;background:currentColor;box-shadow:-4px 1px 0 -0.2px currentColor,4px -1px 0 -0.2px currentColor;opacity:.7}.ico-pin:before{content:"";position:absolute;left:3px;top:1px;width:8px;height:8px;border:1.7px solid currentColor;border-radius:50% 50% 50% 0;transform:rotate(-45deg)}.ico-pin:after{content:"";position:absolute;left:7px;top:4px;width:2px;height:2px;background:currentColor;border-radius:50%}.ico-list:before{content:"";position:absolute;left:4px;top:2px;width:10px;height:1.6px;background:currentColor;box-shadow:0 4.5px 0 currentColor,0 9px 0 currentColor}.ico-list:after{content:"";position:absolute;left:1px;top:2px;width:2px;height:2px;border-radius:50%;background:currentColor;box-shadow:0 4.5px 0 currentColor,0 9px 0 currentColor}.ico-plane:before{content:"✦";position:absolute;font-size:15px;line-height:15px;left:0;top:-1px}.ico-shop:before{content:"";position:absolute;left:2px;top:5px;width:11px;height:8px;border:1.6px solid currentColor;border-radius:2px}.ico-shop:after{content:"";position:absolute;left:5px;top:2px;width:5px;height:6px;border:1.6px solid currentColor;border-bottom:0;border-radius:5px 5px 0 0}.ico-food:before{content:"";position:absolute;left:2px;top:2px;width:2px;height:12px;background:currentColor;box-shadow:9px 0 0 currentColor}.ico-food:after{content:"";position:absolute;left:1px;top:2px;width:4px;height:5px;border-left:1.5px solid currentColor;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;border-radius:0 0 4px 4px}.ico-camera:before{content:"";position:absolute;left:1px;top:4px;width:13px;height:9px;border:1.6px solid currentColor;border-radius:3px}.ico-camera:after{content:"";position:absolute;left:5px;top:6px;width:5px;height:5px;border:1.6px solid currentColor;border-radius:50%;box-shadow:0 -4px 0 -1px currentColor}.ico-hotel:before{content:"";position:absolute;left:2px;top:5px;width:11px;height:7px;border:1.6px solid currentColor;border-radius:2px}.ico-hotel:after{content:"";position:absolute;left:3px;top:2px;width:5px;height:4px;border:1.6px solid currentColor;border-bottom:0;border-radius:4px 4px 0 0}.ico{vertical-align:-2px}.category-icon{display:inline-flex;align-items:center;gap:5px}.near-search-box{border:1px solid var(--line);border-radius:14px;padding:11px;background:#fff;margin-bottom:12px}.near-search-row{display:grid;grid-template-columns:.8fr 1.4fr auto;gap:7px}.near-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}.near-results{display:grid;gap:7px;margin-top:9px}.near-result{display:flex;align-items:center;gap:9px;border:1px solid #e7ecee;border-radius:11px;padding:9px 10px}.near-result-main{flex:1;min-width:0}.near-result-name{font-size:12px;font-weight:700}.near-result-meta{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.4}.near-result-actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}@media(max-width:560px){.near-search-row{grid-template-columns:1fr 1fr}.near-search-row button{grid-column:1/-1}.near-tools{align-items:flex-start}}.any-wants{margin-top:8px}.any-want-list{display:grid;gap:8px}.any-want-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border:1px solid #e4edf4;border-radius:14px;background:#fbfdff}.any-want-row .near-result-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

<body><div class="app">
<header class="top"><div class="title-row"><div><div class="title">Want Map</div><div class="sub">行きたい場所を、地図に残そう。</div></div><button class="btn primary" onclick="openPlace()">＋ 追加</button></div><div class="tabs"><button class="tab active" data-tab="map"><span class="ico ico-map"></span>地図</button><button class="tab" data-tab="places"><span class="ico ico-pin"></span>場所</button><button class="tab" data-tab="items"><span class="ico ico-list"></span>リスト</button><button class="tab" data-tab="trips"><span class="ico ico-plane"></span>旅行</button></div></header>
<main class="content">
<section id="panel-map" class="panel active"><div class="map-wrap"><div id="map" class="map"></div><div class="map-actions"><button onclick="fitAll()">全体表示</button><button onclick="filterVisible()">このエリアだけ</button><button onclick="showNearby()">現在地周辺</button><button onclick="clearMapFilter()">全て表示</button></div></div><div class="section-title">周辺から探す</div><div class="near-search-box"><div class="near-search-row"><select id="nearMode" class="select"><option value="chain">チェーン</option><option value="genre">ジャンル</option></select><select id="nearTarget" class="select"></select><button class="btn primary" onclick="searchNearbyTargets()">近くを探す</button></div><div class="near-tools"><button class="btn" onclick="openTargetManager()">＋ チェーン・ジャンルを追加</button><button class="btn primary" onclick="openAnyWantForm()">＋ どこでもいいWantを登録</button><span class="hint">住所なしで「ダイソー」「ドラッグストア」などを登録できます。</span></div><div id="nearResults" class="near-results"></div><div id="anyWants" class="any-wants"></div></div><div class="section-title">地図の絞り込み</div><div class="filters"><input id="mapQ" class="input" placeholder="場所・住所・ジャンル・メモ・欲しいものを検索"><select id="mapCat" class="select"><option value="">カテゴリすべて</option></select><select id="mapStatus" class="select"><option value="">ステータスすべて</option><option value="want">行きたい</option><option value="done">行った</option><option value="again">また行きたい</option></select></div><div id="mapCards" class="cards"></div></section>
<section id="panel-places" class="panel"><div class="filters"><input id="placeQ" class="input" placeholder="場所・住所・ジャンル・メモ・欲しいもの・駅名・路線を検索"><select id="placeCat" class="select"><option value="">カテゴリすべて</option></select><select id="placeStatus" class="select"><option value="">ステータスすべて</option><option value="want">行きたい</option><option value="done">行った</option><option value="again">また行きたい</option></select></div><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 10px"><span class="label" style="margin:0">並び順</span><select id="placeSort" class="select" style="max-width:220px"><option value="registered">登録順（新しい順）</option><option value="name">名前順</option><option value="address">住所順</option><option value="genre">ジャンル順</option><option value="line">路線順</option><option value="station">最寄り駅順</option><option value="priority">優先度順</option><option value="price">予算順</option><option value="visited">訪問日順</option><option value="distance">現在地から近い順</option></select></div><div class="quickbar"><button class="btn" onclick="showNearby()">現在地から近い場所を表示</button><button class="btn" onclick="showStationSearch()">駅・路線から探す</button><button class="btn primary" onclick="openTodayPanel()">今日行く場所</button></div><div id="nearStatus" class="near-status"></div><div id="stationQuick" style="display:none;margin-bottom:10px"><div class="search-row"><input id="stationQ" class="input" placeholder="駅名・路線名で検索"><button class="btn" onclick="applyStationSearch()">検索</button></div></div><div id="todayPanel" style="display:none" class="route-box"></div><div id="places" class="cards"></div></section>
<section id="panel-items" class="panel"><div class="summary" id="stats"></div><div class="section-title">買いたい・食べたい</div><div class="filters"><input id="itemQ" class="input" placeholder="検索"><select id="itemType" class="select"><option value="">種類すべて</option><option value="buy">買いたい</option><option value="eat">食べたい</option></select><select id="itemStatus" class="select"><option value="">ステータスすべて</option><option value="want">未完了</option><option value="done">済み</option></select></div><div id="items" class="cards"></div></section>
<section id="panel-trips" class="panel"><div class="section-title">旅行・お出かけ</div><button class="btn primary" onclick="openTrip()">＋ 旅行を追加</button><div id="trips" class="cards" style="margin-top:10px"></div><div class="footer-note">旅行に場所を追加すると、その旅行に行きたいスポットをまとめて見られます。</div></section>
</main></div>
<div id="modal" class="modal"><div class="sheet"><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const KEY='want-map-pwa-v2';const TRIP_KEY='want-map-trips-v1';const TARGET_KEY='want-map-near-targets-v1';
const DEFAULT_TARGETS={chain:[['daiso','ダイソー'],['seria','セリア'],['cando','キャンドゥ'],['muji','無印良品'],['loft','ロフト'],['nitori','ニトリ'],['uniqlo','ユニクロ'],['gu','GU'],['starbucks','スターバックス'],['kaldi','カルディ'],['tsutaya','TSUTAYA'],['bookoff','BOOKOFF'],['matsumotokiyoshi','マツモトキヨシ'],['welcia','ウエルシア'],['sugidrug','スギ薬局'],['cocokarafine','ココカラファイン'],['seven','セブンイレブン'],['familymart','ファミリーマート'],['lawson','ローソン']],genre:[['convenience','コンビニ'],['drugstore','ドラッグストア'],['100yen','100円ショップ'],['cafe','カフェ'],['bookstore','本屋'],['supermarket','スーパー'],['homecenter','ホームセンター'],['electronics','家電量販店'],['clothing','衣料品店'],['generalstore','雑貨店'],['bakery','パン屋'],['restaurant','レストラン'],['pharmacy','薬局'],['museum','美術館・博物館']]};
let nearTargets=JSON.parse(localStorage.getItem(TARGET_KEY)||'null')||DEFAULT_TARGETS;
const ANY_WANT_KEY='want-map-any-wants-v1';
let anyWants=JSON.parse(localStorage.getItem(ANY_WANT_KEY)||'[]');
function saveAnyWants(){localStorage.setItem(ANY_WANT_KEY,JSON.stringify(anyWants));renderAnyWants()}
function saveNearTargets(){localStorage.setItem(TARGET_KEY,JSON.stringify(nearTargets))}
let data=JSON.parse(localStorage.getItem(KEY)||'{"places":[],"items":[]}');let trips=JSON.parse(localStorage.getItem(TRIP_KEY)||'[]');let map,markers=[],editing=null,mapAreaFilter=false;
const CATS={food:{label:'飲食店',genres:['カフェ・喫茶店','スイーツ','パン・ベーカリー','和食','洋食','中華','韓国料理','イタリアン','フレンチ','ラーメン','居酒屋','その他']},shopping:{label:'買い物',genres:['服・ファッション','コスメ・美容','雑貨','家具・インテリア','家電','本・文具','食品・食材','お土産','その他']},sightseeing:{label:'観光・スポット',genres:['観光名所','美術館・博物館','神社・寺','公園・自然','撮影スポット','エンタメ','その他']},hotel:{label:'ホテル・宿',genres:['ホテル','旅館','民宿・ゲストハウス','その他']},other:{label:'その他',genres:['その他']}};
function $(id){return document.getElementById(id)}function esc(s=''){return String(s).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}function yen(n){return n?`¥${Number(n).toLocaleString('ja-JP')}`:'—'}function persist(){localStorage.setItem(KEY,JSON.stringify(data));render()}function persistTrips(){localStorage.setItem(TRIP_KEY,JSON.stringify(trips));renderTrips()}
function catOptions(sel=''){return '<option value="">カテゴリを選択</option>'+Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${k===sel?'selected':''}>${v.label}</option>`).join('')}
function genreOptions(cat,sel=''){let gs=CATS[cat]?.genres||[];return '<option value="">選択してください</option>'+gs.map(g=>`<option ${g===sel?'selected':''}>${esc(g)}</option>`).join('')}
function fillFilter(id){$(id).innerHTML='<option value="">カテゴリすべて</option>'+Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('')}
function initMap(){map=L.map('map').setView([35.6812,139.7671],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);renderMap()}
function markerIcon(p){let emoji='';return L.divIcon({className:'',html:`<div class="pin"><span></span></div>`,iconSize:[34,34],iconAnchor:[17,34],popupAnchor:[0,-30]})}
function filteredPlaces(extraArea=false){let q=($('mapQ')?.value||'').toLowerCase(),cat=$('mapCat')?.value||'',status=$('mapStatus')?.value||'';return data.places.filter(p=>{let its=data.items.filter(i=>i.placeId===p.id);let hay=[p.name,p.address,p.city,p.area,p.genre,p.note,p.stationName,...(p.lines||[]),...its.map(i=>i.name),...its.map(i=>i.note)].join(' ').toLowerCase();let ok=(!q||hay.includes(q))&&(!cat||p.category===cat)&&(!status||p.status===status);if(extraArea&&map&&p.lat&&p.lng)ok=ok&&map.getBounds().contains([p.lat,p.lng]);return ok})}
function renderMap(){if(!map)return;markers.forEach(m=>m.remove());markers=[];let arr=filteredPlaces(mapAreaFilter);arr.forEach(p=>{if(p.lat&&p.lng){let m=L.marker([p.lat,p.lng],{icon:markerIcon(p)}).addTo(map).bindPopup(`<b>${esc(p.name)}</b><br>${esc(CATS[p.category]?.label||'')} ${p.genre?'・'+esc(p.genre):''}<br>${esc(p.address||'')}${p.price?'<br>'+yen(p.price):''}<br><button class="btn small" onclick="openPlace('${p.id}')">編集</button>`);markers.push(m)}});renderMapCards(arr)}
function renderMapCards(arr=filteredPlaces(mapAreaFilter)){$('mapCards').innerHTML=arr.length?arr.map(placeCard).join(''):'<div class="empty">この条件の場所はありません。</div>'}
function placeCard(p){let its=data.items.filter(i=>i.placeId===p.id);let stars='★'.repeat(Number(p.priority||0))+'☆'.repeat(3-Number(p.priority||0));let photo=p.photos?.[0]||'';return `<div class="card"><div class="place-head"><div class="place-main"><div class="place-name">${esc(p.name)}</div><div class="meta">${esc(p.address||'住所未登録')}</div>${p.city||p.area?`<div class="meta">${esc([p.city,p.area].filter(Boolean).join(' / '))}</div>`:''}</div><div class="place-side"><span class="status ${p.status==='done'?'done':p.status==='again'?'again':''}">${p.status==='done'?'行った':p.status==='again'?'また行きたい':'行きたい'}</span>${photo?`<img class="place-photo photo-click" onclick="openPhoto('${photo}')" src="${photo}" alt=""><span class="photo-count">写真 ${p.photos.length}枚</span>`:''}</div></div><div class="chips"><span class="chip">${esc(CATS[p.category]?.label||'その他')}</span>${p.genre?`<span class="chip">${esc(p.genre)}</span>`:''}<span class="chip priority">${stars}</span>${p.price?`<span class="chip">予算 ${yen(p.price)}</span>`:''}</div>${p.stationName?`<div class="meta">最寄り駅：${esc(p.stationName)}${p.stationDistance?`（約${Math.round(p.stationDistance)}m）`:''}</div>`:''}${p.lines?.length?`<div class="meta">沿線：${p.lines.map(esc).join(' / ')}</div>`:''}${window.userLocation&&p.lat&&p.lng?`<div class="meta">現在地から約${Math.round(distM(window.userLocation.lat,window.userLocation.lng,p.lat,p.lng)).toLocaleString()}m</div>`:''}${p.visitedAt?`<div class="meta">訪問日：${esc(p.visitedAt)}</div>`:''}${p.note?`<div class="meta">${esc(p.note)}</div>`:''}${(p.tags||[]).length?`<div class="chips">${p.tags.map(t=>`<span class="chip tag-chip">#${esc(t)}</span>`).join('')}</div>`:''}<div class="chips">${its.length?its.map(i=>`<span class="chip"><span class="category-icon"><span class="ico ${i.type==='buy'?'ico-shop':'ico-food'}"></span>${esc(i.name)}</span>${i.price?' ・ '+yen(i.price):''}${i.status==='done'?' ✓':''}</span>`).join(''):'<span class="meta">やりたいこと未登録</span>'}</div><div class="toolbar"><button class="btn" onclick="toggleToday('${p.id}')">${p.today?'今日から外す':'今日行く'}</button><button class="btn" onclick="openItem(null,'${p.id}')">＋ 買う・食べる</button><button class="btn" onclick="openPlace('${p.id}')">編集</button><button class="btn danger" onclick="delPlace('${p.id}')">削除</button></div></div>`}

function openPlace(id=null){editing={kind:'place',id};let p=id?data.places.find(x=>x.id===id):{status:'want',priority:1};$('modalTitle').textContent=id?'場所を編集':'行きたい場所を追加';$('modalBody').innerHTML=`<form id="placeForm" class="form"><div><div class="label">店名・スポット名 *</div><input class="input" name="name" value="${esc(p.name||'')}" placeholder="例：○○カフェ" required></div><div><div class="label">住所 *</div><div class="search-row"><input class="input" id="address" name="address" value="${esc(p.address||'')}" placeholder="例：東京都渋谷区○○1-2-3" required><button type="button" class="btn primary" id="geoBtn">🔍 検索</button></div><div class="geo-help">住所を入力して「検索」すると候補が表示されます。候補を選ぶと地図上のピン位置が決まります。</div><div id="geo" class="geo-status"></div><div id="geoResults" class="geo-results"></div></div><div class="row"><div><div class="label">カテゴリ *</div><select class="select" id="category" name="category" required>${catOptions(p.category||'')}</select></div><div><div class="label">ジャンル</div><select class="select" id="genre" name="genre">${genreOptions(p.category||'',p.genre||'')}</select></div></div><div class="row"><div><div class="label">ステータス</div><select class="select" name="status"><option value="want" ${p.status==='want'||!p.status?'selected':''}>行きたい</option><option value="done" ${p.status==='done'?'selected':''}>行った</option><option value="again" ${p.status==='again'?'selected':''}>また行きたい</option></select></div><div><div class="label">行った日</div><input class="input" type="date" name="visitedAt" value="${p.visitedAt||''}"></div></div><div class="row"><div><div class="label">優先度</div><select class="select" name="priority"><option value="0" ${p.priority==0?'selected':''}>☆ なし</option><option value="1" ${p.priority==1?'selected':''}>★</option><option value="2" ${p.priority==2?'selected':''}>★★</option><option value="3" ${p.priority==3?'selected':''}>★★★</option></select></div></div><div><div class="label">最寄り駅・路線</div><button type="button" class="btn" id="stationBtn">最寄り駅を調べる</button><div id="stationStatus" class="geo-status"></div></div><div><div class="label">価格・予算（円）</div><input class="input" type="number" min="0" name="price" value="${p.price||''}" placeholder="例：5000"></div><div><div class="label">旅行に追加</div><select class="select" name="tripId"><option value="">旅行を選択しない</option>${trips.map(t=>`<option value="${t.id}" ${p.tripId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div><div class="label">タグ</div><input class="input" name="tags" value="${esc((p.tags||[]).join(', '))}" placeholder="例：韓国, 推し活, 写真, 友達と"></div><div><div class="label">メモ</div><textarea class="textarea" name="note" placeholder="予約・注意点・一緒に行く人など">${esc(p.note||'')}</textarea></div><div><div class="label">写真（複数可）</div><input class="input" type="file" id="placePhotos" accept="image/*" multiple><div id="placePhotosPreview" class="photos">${(p.photos||[]).map((s,i)=>`<div class="photo-box"><img class="photo-preview" src="${s}"><button type="button" onclick="removeTempPhoto(${i})">×</button></div>`).join('')}</div></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">キャンセル</button><button class="btn primary">保存</button></div></form>`;$('modal').classList.add('show');bindPlaceForm(p);if(p.lat&&p.lng){$('geo').textContent='✓ 登録済みの地図位置があります';$('geo').className='geo-status ok';$('address').dataset.selectedGeo=JSON.stringify({lat:p.lat,lng:p.lng,city:p.city||'',area:p.area||''});if(p.stationName){let r={stationName:p.stationName,stationDistance:p.stationDistance||0,lines:p.lines||[]};$('stationStatus').dataset.result=JSON.stringify(r);$('stationStatus').textContent=`✓ ${p.stationName}${p.stationDistance?`（約${Math.round(p.stationDistance)}m）`:''}${p.lines?.length?' / '+p.lines.join('・'):''}`;$('stationStatus').className='geo-status ok'}}}
function bindPlaceForm(old){let cat=$('category'),genre=$('genre');cat.onchange=()=>genre.innerHTML=genreOptions(cat.value);$('geoBtn').onclick=()=>searchAddress();$('stationBtn').onclick=()=>lookupStationForForm();$('address').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchAddress()}});$('placePhotos').addEventListener('change',e=>readFiles(e.target.files,'placePhotosPreview',old.photos||[]));$('placeForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),addr=f.get('address').trim(),selected=$('address').dataset.selectedGeo?JSON.parse($('address').dataset.selectedGeo):null;let geo=selected;if(!geo){geo=await searchAddress(true);if(!geo){$('geo').textContent='住所を検索して、候補から場所を選んでください。';$('geo').className='geo-status err';return}}let photos=await collectPhotos(old.photos||[],'placePhotosPreview');let status=f.get('status'),visitedAt=f.get('visitedAt')||'';if(status==='done'&&!visitedAt)visitedAt=new Date().toISOString().slice(0,10);let station=old.stationName?{stationName:old.stationName,stationDistance:old.stationDistance,lines:old.lines||[]}:{};if($('stationStatus')?.dataset.result)station=JSON.parse($('stationStatus').dataset.result);let x={name:f.get('name').trim(),address:addr,category:f.get('category'),genre:f.get('genre'),status,priority:Number(f.get('priority')||0),visitedAt,price:Number(f.get('price')||0),tripId:f.get('tripId')||'',tags:String(f.get('tags')||'').split(',').map(s=>s.trim()).filter(Boolean),note:f.get('note')||'',photos,lat:geo?.lat??old.lat??null,lng:geo?.lng??old.lng??null,city:geo?.city??old.city??'',area:geo?.area??old.area??'',stationName:station.stationName||'',stationDistance:station.stationDistance||0,lines:station.lines||[],today:old.today||false};if(editing.id)Object.assign(data.places.find(p=>p.id===editing.id),x);else data.places.push({id:uid(),...x});closeModal();persist()}}
async function searchAddress(autoPick=false){let addr=$('address')?.value.trim(),name=document.querySelector('#placeForm [name="name"]')?.value.trim();if(!addr)return null;$('geo').textContent='場所を検索中…';$('geo').className='geo-status';$('geoResults').innerHTML='';try{let q=[name,addr].filter(Boolean).join(', ');let url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&addressdetails=1&accept-language=ja&q='+encodeURIComponent(q);let r=await fetch(url,{headers:{'Accept':'application/json'}});if(!r.ok)throw new Error('HTTP '+r.status);let a=await r.json();if(!a.length&&name){url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&addressdetails=1&accept-language=ja&q='+encodeURIComponent(addr);r=await fetch(url,{headers:{'Accept':'application/json'}});a=await r.json()}if(!a.length){$('geo').textContent='候補が見つかりませんでした。住所を少し簡略化して再検索してください。';$('geo').className='geo-status err';return null}if(autoPick){let x=a[0],ad=x.address||{};let geo={lat:Number(x.lat),lng:Number(x.lon),city:ad.city||ad.town||ad.village||ad.municipality||'',area:ad.suburb||ad.neighbourhood||ad.quarter||ad.city_district||''};$('address').dataset.selectedGeo=JSON.stringify(geo);$('geo').textContent='✓ 地図上の位置を取得しました';$('geo').className='geo-status ok';return geo}$('geo').textContent=`候補が${a.length}件見つかりました。正しい場所を選択してください。`;$('geo').className='geo-status ok';$('geoResults').innerHTML=a.map((x,i)=>`<button type="button" class="geo-result" onclick="selectGeo(${i})"><b>${esc(x.name||'候補')}</b><span>${esc(x.display_name||'')}</span></button>`).join('');window._geoCandidates=a;return null}catch(e){$('geo').textContent='位置検索に失敗しました。通信状態を確認してください。';$('geo').className='geo-status err';return null}}
function selectGeo(i){let x=window._geoCandidates?.[i];if(!x)return;let ad=x.address||{};let geo={lat:Number(x.lat),lng:Number(x.lon),city:ad.city||ad.town||ad.village||ad.municipality||'',area:ad.suburb||ad.neighbourhood||ad.quarter||ad.city_district||''};$('address').dataset.selectedGeo=JSON.stringify(geo);$('geoResults').innerHTML='';$('geo').textContent='✓ この場所を選択しました。保存すると地図にピンが付きます';$('geo').className='geo-status ok';lookupStation(geo.lat,geo.lng)}
async function lookupStationForForm(){let g=$('address')?.dataset.selectedGeo;if(!g){$('stationStatus').textContent='先に住所を検索して候補を選択してください。';$('stationStatus').className='geo-status err';return}let geo=JSON.parse(g);await lookupStation(geo.lat,geo.lng)}
async function lookupStation(lat,lng){let el=$('stationStatus');if(!el)return;el.textContent='最寄り駅・路線を検索中…';el.className='geo-status';try{let q=`[out:json][timeout:20];node(around:1800,${lat},${lng})[railway~"^(station|halt)$"];out body;`;let r=await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q));if(!r.ok)throw new Error('station '+r.status);let a=(await r.json()).elements||[];if(!a.length){el.textContent='近くの駅が見つかりませんでした。';el.className='geo-status err';return}a.sort((x,y)=>distM(lat,lng,Number(x.lat),Number(x.lon))-distM(lat,lng,Number(y.lat),Number(y.lon)));let st=a[0],distance=distM(lat,lng,Number(st.lat),Number(st.lon));let q2=`[out:json][timeout:20];node(${st.id});rel(bn)["type"="route"]["route"~"^(train|subway|tram|light_rail|monorail)$"];out tags;`;let r2=await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q2));let rels=r2.ok?(await r2.json()).elements||[]:[];let lines=[...new Set(rels.map(x=>x.tags?.name||x.tags?.ref).filter(Boolean))];let result={stationName:st.tags?.name||'最寄り駅',stationDistance:distance,lines};el.dataset.result=JSON.stringify(result);el.textContent=`✓ ${result.stationName}（約${Math.round(distance)}m）${lines.length?' / '+lines.join('・'):''}`;el.className='geo-status ok'}catch(e){el.textContent='駅・路線の検索に失敗しました。後から再検索できます。';el.className='geo-status err'}}
function distM(a,b,c,d){let R=6371000,to=x=>x*Math.PI/180,da=to(c-a),db=to(d-b),x=Math.sin(da/2)**2+Math.cos(to(a))*Math.cos(to(c))*Math.sin(db/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function readFiles(files,previewId,existing){let box=$(previewId);[...files].forEach(file=>{let r=new FileReader();r.onload=()=>{let d=document.createElement('div');d.className='photo-box';d.dataset.temp=r.result;d.innerHTML=`<img class="photo-preview" src="${r.result}"><button type="button">×</button>`;d.querySelector('button').onclick=()=>d.remove();box.appendChild(d)};r.readAsDataURL(file)})}
async function collectPhotos(existing,previewId){let arr=[];document.querySelectorAll('#'+previewId+' .photo-box').forEach(b=>arr.push(b.dataset.temp||b.querySelector('img')?.src));return arr.filter(Boolean)}
function removeTempPhoto(i){let boxes=document.querySelectorAll('#placePhotosPreview .photo-box');if(boxes[i])boxes[i].remove()}
function openItem(id=null,placeId=''){editing={kind:'item',id};let i=id?data.items.find(x=>x.id===id):{type:'buy',placeId,status:'want'};$('modalTitle').textContent=id?'リストを編集':'買いたい・食べたいを追加';$('modalBody').innerHTML=`<form id="itemForm" class="form"><div><div class="label">内容 *</div><input class="input" name="name" value="${esc(i.name||'')}" placeholder="例：クロッフル、コスメ" required></div><div class="row"><div><div class="label">種類</div><select class="select" name="type"><option value="buy" ${i.type==='buy'?'selected':''}>買いたい</option><option value="eat" ${i.type==='eat'?'selected':''}>食べたい</option></select></div><div><div class="label">場所 *</div><select class="select" name="placeId" required>${data.places.map(p=>`<option value="${p.id}" ${i.placeId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div></div><div class="row"><div><div class="label">価格・予算（円）</div><input class="input" type="number" min="0" name="price" value="${i.price||''}" placeholder="例：3000"></div><div><div class="label">ステータス</div><select class="select" name="status"><option value="want" ${i.status!=='done'?'selected':''}>行きたい</option><option value="done" ${i.status==='done'?'selected':''}>済み</option></select></div></div><div><div class="label">メモ</div><textarea class="textarea" name="note">${esc(i.note||'')}</textarea></div><div><div class="label">写真</div><input class="input" type="file" name="photo" accept="image/*"><div class="photos">${i.photo?`<img class="photo-preview" src="${i.photo}">`:''}</div></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">キャンセル</button><button class="btn primary">保存</button></div></form>`;$('modal').classList.add('show');$('itemForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),old=id?data.items.find(x=>x.id===id):{},photo=old.photo||null,file=f.get('photo');if(file&&file.size)photo=await fileToData(file);let x={name:f.get('name').trim(),type:f.get('type'),placeId:f.get('placeId'),price:Number(f.get('price')||0),status:f.get('status'),note:f.get('note')||'',photo};if(id)Object.assign(old,x);else data.items.push({id:uid(),...x});closeModal();persist()}}
function fileToData(file){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
function toggleItemDone(id,checked){let i=data.items.find(x=>x.id===id);if(!i)return;i.status=checked?'done':'want';persist()}
function delPlace(id){if(confirm('この場所と紐づくリストも削除しますか？')){data.places=data.places.filter(p=>p.id!==id);data.items=data.items.filter(i=>i.placeId!==id);persist()}}function delItem(id){if(confirm('削除しますか？')){data.items=data.items.filter(i=>i.id!==id);persist()}}
function toggleToday(id){let p=data.places.find(x=>x.id===id);if(!p)return;p.today=!p.today;persist()}
function moveToday(id,dir){let idx=data.places.findIndex(p=>p.id===id);if(idx<0)return;let ids=data.places.map(p=>p.id);let todayIdxs=ids.filter(x=>data.places.find(p=>p.id===x)?.today);let pos=todayIdxs.indexOf(id),next=pos+dir;if(pos<0||next<0||next>=todayIdxs.length)return;let swapId=todayIdxs[next],j=data.places.findIndex(p=>p.id===swapId);[data.places[idx],data.places[j]]=[data.places[j],data.places[idx]];persist();openTodayPanel()}
function openTodayPanel(){let ps=data.places.filter(p=>p.today);$('todayPanel').style.display='block';$('todayPanel').innerHTML=`<div style="font-weight:750">今日行く場所 ${ps.length}件</div>${ps.length?`<div class="today-list">${ps.map((p,i)=>`<div class="today-row"><span>${i+1}</span><span class="name">${esc(p.name)}</span><span class="meta">${esc(p.stationName||'')}</span><button class="btn small" onclick="moveToday('${p.id}',-1)">↑</button><button class="btn small" onclick="moveToday('${p.id}',1)">↓</button><button class="btn small" onclick="openPlace('${p.id}')">詳細</button><button class="btn small" onclick="toggleToday('${p.id}')">外す</button></div>`).join('')}</div><div class="toolbar"><button class="btn primary" onclick="openRoute()">ルートを作る</button><button class="btn" onclick="clearToday()">今日を全て外す</button></div>`:'<div class="empty" style="padding:16px">まだ「今日行く」場所がありません。</div>'}`;}
function clearToday(){data.places.forEach(p=>p.today=false);persist();openTodayPanel()}
function openRoute(){let ps=data.places.filter(p=>p.today&&p.lat&&p.lng);if(!ps.length){alert('今日行く場所に地図位置がある場所を追加してください。');return}let origin=ps[0],dest=ps[ps.length-1],way=ps.slice(1,-1);let url='https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(origin.lat+','+origin.lng)+'&destination='+encodeURIComponent(dest.lat+','+dest.lng)+(way.length?'&waypoints='+encodeURIComponent(way.map(p=>p.lat+','+p.lng).join('|')):'')+'&travelmode=transit';window.open(url,'_blank')}
function showNearby(){if(!navigator.geolocation){alert('この端末では現在地を取得できません。');return}navigator.geolocation.getCurrentPosition(pos=>{window.userLocation={lat:pos.coords.latitude,lng:pos.coords.longitude};$('nearStatus').textContent='現在地から近い順で表示しています。';if($('placeSort'))$('placeSort').value='distance';renderPlaces();if(map){map.setView([window.userLocation.lat,window.userLocation.lng],14);L.circleMarker([window.userLocation.lat,window.userLocation.lng],{radius:7}).addTo(map).bindPopup('現在地').openPopup()}},()=>alert('現在地を取得できませんでした。位置情報の許可を確認してください。'),{enableHighAccuracy:true,timeout:10000,maximumAge:60000})}

function renderPlaces(){let q=($('placeQ')?.value||'').toLowerCase(),cat=$('placeCat')?.value||'',st=$('placeStatus')?.value||'',sort=$('placeSort')?.value||'registered';let arr=data.places.filter(p=>{let its=data.items.filter(i=>i.placeId===p.id);let hay=[p.name,p.address,p.city,p.area,p.genre,p.note,p.stationName,...(p.lines||[]),...its.map(i=>i.name),...its.map(i=>i.note),p.tripId].join(' ').toLowerCase();return(!q||hay.includes(q))&&(!cat||p.category===cat)&&(!st||p.status===st)});let text=v=>String(v||'').trim();let cmp=(a,b)=>text(a).localeCompare(text(b),'ja',{numeric:true,sensitivity:'base'});if(sort==='name')arr.sort((a,b)=>cmp(a.name,b.name));else if(sort==='address')arr.sort((a,b)=>cmp(a.address,b.address));else if(sort==='genre')arr.sort((a,b)=>cmp(a.genre,b.genre)||cmp(a.name,b.name));else if(sort==='line')arr.sort((a,b)=>cmp((a.lines||[]).join(' / '),(b.lines||[]).join(' / '))||cmp(a.name,b.name));else if(sort==='station')arr.sort((a,b)=>cmp(a.stationName,b.stationName)||cmp(a.name,b.name));else if(sort==='priority')arr.sort((a,b)=>Number(b.priority||0)-Number(a.priority||0)||cmp(a.name,b.name));else if(sort==='price')arr.sort((a,b)=>Number(b.price||0)-Number(a.price||0)||cmp(a.name,b.name));else if(sort==='visited')arr.sort((a,b)=>text(b.visitedAt).localeCompare(text(a.visitedAt))||cmp(a.name,b.name));else if(sort==='distance'){if(window.userLocation)arr.sort((a,b)=>distM(window.userLocation.lat,window.userLocation.lng,a.lat,a.lng)-distM(window.userLocation.lat,window.userLocation.lng,b.lat,b.lng));else arr.sort((a,b)=>cmp(a.name,b.name));}else arr.sort((a,b)=>String(b.id||'').localeCompare(String(a.id||'')));$('places').innerHTML=arr.length?arr.map(placeCard).join(''):'<div class="empty">条件に合う場所がありません。</div>'}

function renderItems(){let q=($('itemQ')?.value||'').toLowerCase(),t=$('itemType')?.value||'',st=$('itemStatus')?.value||'';let arr=data.items.filter(i=>{let p=data.places.find(p=>p.id===i.placeId);return(!q||[i.name,i.note,p?.name,p?.address,p?.genre,p?.stationName,...(p?.lines||[])].join(' ').toLowerCase().includes(q))&&(!t||i.type===t)&&(!st||i.status===st)});$('items').innerHTML=arr.length?arr.map(i=>{let p=data.places.find(p=>p.id===i.placeId);return `<div class="card"><div class="item">${i.photo?`<img class="thumb" src="${i.photo}">`:''}<div class="item-main"><div class="item-name"><span class="category-icon"><span class="ico ${i.type==='buy'?'ico-shop':'ico-food'}"></span>${esc(i.name)}</span></div><div class="item-meta">${esc(p?.name||'場所未設定')} ${i.price?'・ '+yen(i.price):''}</div><div class="chips"><label class="check-item"><input type="checkbox" ${i.status==='done'?'checked':''} onchange="toggleItemDone('${i.id}',this.checked)"><span>${i.status==='done'?'済み':'未完了'}</span></label>${i.note?`<span class="chip">${esc(i.note)}</span>`:''}</div></div><button class="btn" onclick="openItem('${i.id}')">編集</button><button class="btn danger" onclick="delItem('${i.id}')">削除</button></div></div>`}).join(''):'<div class="empty">条件に合うものがありません。</div>';let want=data.items.filter(i=>i.status!=='done').length,done=data.items.filter(i=>i.status==='done').length,total=data.items.reduce((s,i)=>s+Number(i.price||0),0);$('stats').innerHTML=`<div class="stat"><b>${want}</b><span>未完了</span></div><div class="stat"><b>${done}</b><span>済み</span></div><div class="stat"><b>${yen(total)}</b><span>登録価格合計</span></div>`}
function renderTrips(){let totalBudget=trips.reduce((s,t)=>s+Number(t.budget||0),0);$('trips').innerHTML=trips.length?trips.map(t=>{let ps=data.places.filter(p=>p.tripId===t.id),spent=ps.reduce((s,p)=>s+Number(p.price||0),0)+data.items.filter(i=>ps.some(p=>p.id===i.placeId)).reduce((s,i)=>s+Number(i.price||0),0);return `<div class="card trip-card"><div class="trip-info"><div class="trip-name"><span class="category-icon"><span class="ico ico-plane"></span>${esc(t.name)}</span></div><div class="meta">${t.date?esc(t.date):''} ・ ${ps.length}か所 ${t.budget?'・予算 '+yen(t.budget):''}</div><div class="meta">登録価格 ${yen(spent)}</div></div><button class="btn" onclick="openTrip('${t.id}')">編集</button><button class="btn danger" onclick="delTrip('${t.id}')">削除</button></div>`}).join(''):'<div class="empty">まだ旅行がありません。</div>'}
function openTrip(id=null){let t=id?trips.find(x=>x.id===id):{};$('modalTitle').textContent=id?'旅行を編集':'旅行を追加';$('modalBody').innerHTML=`<form id="tripForm" class="form"><div><div class="label">旅行名 *</div><input class="input" name="name" value="${esc(t.name||'')}" placeholder="例：韓国旅行 2026.09" required></div><div class="row"><div><div class="label">日付</div><input class="input" type="date" name="date" value="${t.date||''}"></div><div><div class="label">旅行予算（円）</div><input class="input" type="number" min="0" name="budget" value="${t.budget||''}" placeholder="例：100000"></div></div><div><div class="label">メモ</div><textarea class="textarea" name="note">${esc(t.note||'')}</textarea></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">キャンセル</button><button class="btn primary">保存</button></div></form>`;$('modal').classList.add('show');$('tripForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),x={name:f.get('name').trim(),date:f.get('date'),budget:Number(f.get('budget')||0),note:f.get('note')||''};if(id)Object.assign(trips.find(t=>t.id===id),x);else trips.push({id:uid(),...x});closeModal();persistTrips()}}
function delTrip(id){if(confirm('旅行を削除しますか？登録した場所は削除されず、旅行との紐付けだけ外れます。')){trips=trips.filter(t=>t.id!==id);data.places.forEach(p=>{if(p.tripId===id)p.tripId=''});persist();persistTrips()}}
function filterVisible(){mapAreaFilter=true;renderMap();let arr=filteredPlaces(true);if(arr.length){let b=L.latLngBounds(arr.filter(p=>p.lat&&p.lng).map(p=>[p.lat,p.lng]));if(b.isValid())map.fitBounds(b.pad(.2))}}function clearMapFilter(){mapAreaFilter=false;renderMap()}function fitAll(){mapAreaFilter=false;let ps=data.places.filter(p=>p.lat&&p.lng);if(ps.length){let b=L.latLngBounds(ps.map(p=>[p.lat,p.lng]));map.fitBounds(b.pad(.2))}}

function searchNearbyTargetsCustom(w){if(!navigator.geolocation)return alert('現在地を取得できません。');let box=$('nearResults');box.innerHTML='<div class="hint">現在地を取得しています…</div>';navigator.geolocation.getCurrentPosition(async pos=>{let q;if(w.kind==='free'){let name=w.name.replace(/[\\^$.*+?()[\]{}|]/g,'\\$&');q=`nwr["name"~"${name}",i](around:5000,${pos.coords.latitude},${pos.coords.longitude});`}else{q=targetOverpass(w.kind,w.targetId);if(!q){box.innerHTML='<div class="hint">この項目はまだ周辺検索に対応していません。</div>';return}q=q.replaceAll('LAT',String(pos.coords.latitude)).replaceAll('LNG',String(pos.coords.longitude))}let query='[out:json][timeout:20];('+q+');out center tags;';try{let r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:query,headers:{'Content-Type':'text/plain'}});if(!r.ok)throw new Error();let j=await r.json();let arr=(j.elements||[]).map(e=>{let lat=e.lat??e.center?.lat,lng=e.lon??e.center?.lon,t=e.tags||{};return {id:e.id,lat,lng,name:t.name||w.name,address:[t['addr:postcode'],t['addr:city'],t['addr:ward'],t['addr:street'],t['addr:housenumber']].filter(Boolean).join(' ')}}).filter(x=>x.lat&&x.lng);arr.sort((a,b)=>distM(pos.coords.latitude,pos.coords.longitude,a.lat,a.lng)-distM(pos.coords.latitude,pos.coords.longitude,b.lat,b.lng));arr=arr.slice(0,15);box.innerHTML=arr.length?arr.map(x=>`<div class="near-result"><div class="near-result-main"><div class="near-result-name">${esc(x.name)}</div><div class="near-result-meta">現在地から約${Math.round(distM(pos.coords.latitude,pos.coords.longitude,x.lat,x.lng)).toLocaleString()}m${x.address?' ・ '+esc(x.address):''}</div></div><div class="near-result-actions"><button class="btn small" onclick="addNearbyPlace(${JSON.stringify(x).replace(/"/g,'&quot;')},'${esc(w.name)}')">Wantに登録</button><button class="btn small" onclick="nearToday(${JSON.stringify(x).replace(/"/g,'&quot;')},'${esc(w.name)}')">今日行く</button></div></div>`).join(''):'<div class="empty" style="padding:18px">近くに見つかりませんでした。</div>'}catch(e){box.innerHTML='<div class="hint">周辺検索に失敗しました。少し時間を置いてもう一度試してください。</div>'}},()=>{box.innerHTML='<div class="hint">位置情報の許可を確認してください。</div>'},{enableHighAccuracy:true,timeout:10000,maximumAge:60000})}
function openTargetManager(){let rows=(mode)=>nearTargets[mode].map((x,i)=>`<div class="today-row"><span class="name">${esc(x[1])}</span><span class="meta">${mode==='chain'?'チェーン':'ジャンル'}</span><button class="btn small" onclick="removeNearTarget('${mode}',${i})">削除</button></div>`).join('');$('modalTitle').textContent='チェーン・ジャンルを管理';$('modalBody').innerHTML=`<div class="form"><div class="hint">最初から入っている候補に加えて、自分で好きなチェーンやジャンルを追加できます。</div><div class="row"><div><div class="label">種類</div><select id="targetKind" class="select"><option value="chain">チェーン</option><option value="genre">ジャンル</option></select></div><div><div class="label">名前</div><input id="targetName" class="input" placeholder="例：3COINS / 韓国コスメ店"></div></div><div class="actions"><button class="btn" onclick="closeModal()">閉じる</button><button class="btn primary" onclick="addNearTarget()">追加</button></div><div class="section-title" style="margin-top:12px">登録済みチェーン</div><div class="today-list">${rows('chain')||'<div class="empty" style="padding:10px">なし</div>'}</div><div class="section-title">登録済みジャンル</div><div class="today-list">${rows('genre')||'<div class="empty" style="padding:10px">なし</div>'}</div></div>`;$('modal').classList.add('show')}
function addNearTarget(){let kind=$('targetKind').value,name=$('targetName').value.trim();if(!name)return alert('名前を入力してください。');let id='custom-'+Date.now();nearTargets[kind].push([id,name]);saveNearTargets();closeModal();refreshNearTargets();renderAnyWants()}

function targetOverpass(kind,id){let t=(nearTargets[kind]||[]).find(x=>x[0]===id);if(!t)return null;let q='';if(kind==='chain'){let name=t[1].replace(/[\\^$.*+?()[\]{}|]/g,'\\\\$&');q=`nwr["name"~"${name}",i](around:5000,LAT,LNG);`}else{const m={convenience:'nwr["shop"="convenience"](around:5000,LAT,LNG);',drugstore:'nwr["shop"="chemist"](around:5000,LAT,LNG);', '100yen':'nwr["shop"="variety_store"]["name"~"ダイソー|セリア|キャンドゥ",i](around:5000,LAT,LNG);',cafe:'nwr["amenity"="cafe"](around:5000,LAT,LNG);',bookstore:'nwr["shop"="books"](around:5000,LAT,LNG);',supermarket:'nwr["shop"="supermarket"](around:5000,LAT,LNG);',homecenter:'nwr["shop"="doityourself"](around:5000,LAT,LNG);',electronics:'nwr["shop"="electronics"](around:5000,LAT,LNG);',clothing:'nwr["shop"="clothes"](around:5000,LAT,LNG);',generalstore:'nwr["shop"="variety_store"](around:5000,LAT,LNG);',bakery:'nwr["shop"="bakery"](around:5000,LAT,LNG);',restaurant:'nwr["amenity"="restaurant"](around:5000,LAT,LNG);',pharmacy:'nwr["amenity"="pharmacy"](around:5000,LAT,LNG);',museum:'nwr["tourism"="museum"](around:5000,LAT,LNG);'};q=m[id]||''}return q}
function searchNearbyTargets(){if(!navigator.geolocation)return alert('現在地を取得できません。');let kind=$('nearMode').value,id=$('nearTarget').value;let target=(nearTargets[kind]||[]).find(x=>x[0]===id);if(!target)return;let box=$('nearResults');box.innerHTML='<div class="hint">現在地を取得しています…</div>';navigator.geolocation.getCurrentPosition(async pos=>{window.userLocation={lat:pos.coords.latitude,lng:pos.coords.longitude};let q=targetOverpass(kind,id);if(!q){box.innerHTML='<div class="hint">この項目は検索条件をまだ登録できません。</div>';return}q=q.replaceAll('LAT',String(pos.coords.latitude)).replaceAll('LNG',String(pos.coords.longitude));let query='[out:json][timeout:20];('+q+');out center tags;';try{let r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:query,headers:{'Content-Type':'text/plain'}});if(!r.ok)throw new Error('search');let j=await r.json();let arr=(j.elements||[]).map(e=>{let lat=e.lat??e.center?.lat,lng=e.lon??e.center?.lon,t=e.tags||{};return {id:e.id,lat,lng,name:t.name||target[1],address:[t['addr:postcode'],t['addr:city'],t['addr:ward'],t['addr:street'],t['addr:housenumber']].filter(Boolean).join(' ')}}).filter(x=>x.lat&&x.lng);arr.sort((a,b)=>distM(pos.coords.latitude,pos.coords.longitude,a.lat,a.lng)-distM(pos.coords.latitude,pos.coords.longitude,b.lat,b.lng));arr=arr.slice(0,15);box.innerHTML=arr.length?arr.map((x,i)=>`<div class="near-result"><div class="near-result-main"><div class="near-result-name">${esc(x.name)}</div><div class="near-result-meta">現在地から約${Math.round(distM(pos.coords.latitude,pos.coords.longitude,x.lat,x.lng)).toLocaleString()}m${x.address?' ・ '+esc(x.address):''}</div></div><div class="near-result-actions"><button class="btn small" onclick="addNearbyPlace(${JSON.stringify(x).replace(/"/g,'&quot;')},'${esc(target[1])}')">Wantに登録</button><button class="btn small" onclick="nearToday(${JSON.stringify(x).replace(/"/g,'&quot;')},'${esc(target[1])}')">今日行く</button></div></div>`).join(''):'<div class="empty" style="padding:18px">近くに見つかりませんでした。</div>'}catch(e){box.innerHTML='<div class="hint">周辺検索に失敗しました。少し時間を置いてもう一度試してください。</div>'}},()=>{box.innerHTML='<div class="hint">位置情報の許可を確認してください。</div>'},{enableHighAccuracy:true,timeout:10000,maximumAge:60000})}
function addNearbyPlace(x,label,today=false){let p={id:uid(),name:x.name||label,address:x.address||'',lat:x.lat,lng:x.lng,status:'want',priority:1,category:'shopping',genre:'',price:0,tripId:'',tags:['周辺検索'],note:`${label}（どこでもいい）`,photos:[],today:!!today};data.places.push(p);persist();render();alert(`${p.name} をWant Mapに登録しました。`)}
function nearToday(x,label){addNearbyPlace(x,label,true)}

function render(){renderMap();renderPlaces();renderItems();renderTrips();refreshNearTargets();renderAnyWants()}fillFilter('mapCat');fillFilter('placeCat');initMap();render();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js?v=15').catch(()=>{});
